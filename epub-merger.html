<!doctype html>
<html lang="zh-Hant">

<head>

<meta charset="utf-8">

<meta

  content="width=device-width, initial-scale=1"
>

<link
  href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"

>

<body>

<div class="container py-5">

EPUB 合併工具
</h1>

將多個 EPUB 合併成一個完整 EPUB
</p>

</div>


<!-- 選擇檔案 -->

<div class="card border-0 shadow-sm mb-4">

<div class="card-body p-4">

<div
  id="dropZone"
  class="drop-zone"

>

</div>

</div>


<!-- 檔案列表 -->

<div class="card border-0 shadow-sm mb-4">

<div class="card-header bg-body d-flex justify-content-between">

EPUB 順序
</strong>

清除
</button>

</div>


<div class="card-body p-0">

<div
  id="emptyMessage"

>
尚未加入 EPUB
</div>


<div
  id="fileTableWrapper"

>

<tr>

</th>

</tr>

</table>

</div>

</div>

</div>

<div class="card-body p-4">

</span>

>
0%
</div>

></div>

</div>

</div>


<div class="alert alert-info">

<strong>注意：</strong>

所有 EPUB 都只會在你的瀏覽器本機處理，
不會上傳到伺服器。

<br>

第一個 EPUB 的封面會作為合併後 EPUB 的封面。

</div>


</div>

</div>

<script type="module">

import JSZip from
"https://cdn.jsdelivr.net/npm/jszip@3.10.1/+esm";


/* =========================================================
   DOM
========================================================= */

const $ = s => document.querySelector(s);

const fileInput =
$("#fileInput");

const selectBtn =
$("#selectBtn");

const dropZone =
$("#dropZone");

const fileList =
$("#fileList");

const emptyMessage =
$("#emptyMessage");

const fileTableWrapper =
$("#fileTableWrapper");

const clearBtn =
$("#clearBtn");

const mergeBtn =
$("#mergeBtn");

const outputName =
$("#outputName");

const progressBar =
$("#progressBar");

const progressText =
$("#progressText");

const statusText =
$("#statusText");

const logBox =
$("#log");


let files = [];


/* =========================================================
   基本工具
========================================================= */

function log(text){

  const div =
  document.createElement("div");

  div.textContent =
  `[${new Date().toLocaleTimeString()}] ${text}`;

  logBox.appendChild(div);

  logBox.scrollTop =
  logBox.scrollHeight;

}


function progress(value,text){

  value =
  Math.max(0,Math.min(100,value));

  progressBar.style.width =
  value+"%";

  progressBar.textContent =
  Math.round(value)+"%";

  progressText.textContent =
  Math.round(value)+"%";

  if(text)
    statusText.textContent =
    text;

}


function esc(value){

  return String(value ?? "")
  .replace(/&/g,"&amp;")
  .replace(/</g,"&lt;")
  .replace(/>/g,"&gt;")
  .replace(/"/g,"&quot;")
  .replace(/'/g,"&apos;");

}


function normalizePath(path){

  const result = [];

  for(
    const part of
    decodeURIComponent(
      String(path || "")
    )
    .replace(/\\/g,"/")
    .split("/")
  ){

    if(
      !part ||
      part === "."
    )
      continue;

    if(part === ".."){

      result.pop();

    }else{

      result.push(part);

    }

  }

  return result.join("/");

}


function dirname(path){

  const i =
  path.lastIndexOf("/");

  return i < 0
    ? ""
    : path.slice(0,i);

}


function resolvePath(base,href){

  href =
  String(href || "")
  .split("#")[0]
  .split("?")[0];

  return normalizePath(
    base
    ? base+"/"+href
    : href
  );

}


/*
 * 將 EPUB root 下的檔案路徑，
 * 轉成指定檔案所在目錄的相對路徑。
 *
 * 例如：
 *
 * target = books/001/OEBPS/Text/ch1.xhtml
 *
 * nav.xhtml 位於：
 *
 * EPUB/nav.xhtml
 *
 * 得到：
 *
 * ../books/001/OEBPS/Text/ch1.xhtml
 */

function relativePath(fromFile,toFile){

  const fromParts =
  normalizePath(fromFile)
  .split("/")
  .filter(Boolean);

  fromParts.pop();

  const toParts =
  normalizePath(toFile)
  .split("/")
  .filter(Boolean);

  let common = 0;

  while(
    common < fromParts.length &&
    common < toParts.length &&
    fromParts[common] === toParts[common]
  ){

    common++;

  }

  const result = [];

  for(
    let i=common;
    i<fromParts.length;
    i++
  ){

    result.push("..");

  }

  for(
    let i=common;
    i<toParts.length;
    i++
  ){

    result.push(toParts[i]);

  }

  return result.join("/") || ".";
}


function formatSize(bytes){

  if(bytes < 1024)
    return bytes+" B";

  if(bytes < 1024*1024)
    return (
      bytes/1024
    ).toFixed(1)+" KB";

  return (
    bytes/1024/1024
  ).toFixed(2)+" MB";

}


function mediaType(path){

  const ext =
  (path.match(/\.[^.\/]+$/)||[""])[0]
  .toLowerCase();

  const map={

    ".xhtml":
    "application/xhtml+xml",

    ".html":
    "application/xhtml+xml",

    ".htm":
    "application/xhtml+xml",

    ".css":
    "text/css",

    ".jpg":
    "image/jpeg",

    ".jpeg":
    "image/jpeg",

    ".png":
    "image/png",

    ".gif":
    "image/gif",

    ".webp":
    "image/webp",

    ".svg":
    "image/svg+xml",

    ".avif":
    "image/avif",

    ".mp3":
    "audio/mpeg",

    ".m4a":
    "audio/mp4",

    ".aac":
    "audio/aac",

    ".ogg":
    "audio/ogg",

    ".oga":
    "audio/ogg",

    ".wav":
    "audio/wav",

    ".mp4":
    "video/mp4",

    ".webm":
    "video/webm",

    ".smil":
    "application/smil+xml",

    ".ncx":
    "application/x-dtbncx+xml",

    ".woff":
    "font/woff",

    ".woff2":
    "font/woff2",

    ".ttf":
    "font/ttf",

    ".otf":
    "font/otf",

    ".js":
    "application/javascript"

  };

  return map[ext] ||
  "application/octet-stream";

}


/* =========================================================
   檔案選擇
========================================================= */

selectBtn.onclick =
() => fileInput.click();


dropZone.onclick =
e => {

  if(
    e.target !== selectBtn
  )
    fileInput.click();

};


fileInput.onchange =
e => {

  addFiles(
    [...e.target.files]
  );

  fileInput.value="";

};


dropZone.ondragover =
e => {

  e.preventDefault();

  dropZone.classList.add(
    "dragover"
  );

};


dropZone.ondragleave =
() => {

  dropZone.classList.remove(
    "dragover"
  );

};


dropZone.ondrop =
e => {

  e.preventDefault();

  dropZone.classList.remove(
    "dragover"
  );

  addFiles(
    [...e.dataTransfer.files]
    .filter(
      f => /\.epub$/i.test(f.name)
    )
  );

};


function addFiles(newFiles){

  for(const file of newFiles){

    if(
      !/\.epub$/i.test(file.name)
    )
      continue;

    if(
      files.some(
        f =>
          f.name === file.name &&
          f.size === file.size &&
          f.lastModified === file.lastModified
      )
    )
      continue;

    files.push(file);

  }

  renderFiles();

}


/* =========================================================
   檔案列表
========================================================= */

function renderFiles(){

  fileList.innerHTML="";

  if(!files.length){

    emptyMessage.classList.remove(
      "d-none"
    );

    fileTableWrapper.classList.add(
      "d-none"
    );

    mergeBtn.disabled=true;

    clearBtn.disabled=true;

    return;

  }


  emptyMessage.classList.add(
    "d-none"
  );

  fileTableWrapper.classList.remove(
    "d-none"
  );

  mergeBtn.disabled=false;

  clearBtn.disabled=false;


  files.forEach(
    (file,index) => {

      const tr =
      document.createElement("tr");

      tr.className =
      "file-row";

      tr.draggable=true;

      tr.dataset.index=index;


      tr.innerHTML=`

<td class="text-center">
<span class="handle">☰</span>
</td>

<td>
<span class="badge text-bg-primary">
${index+1}
</span>
</td>

<td>
<div class="fw-semibold">
${esc(file.name)}
</div>
</td>

<td>
${formatSize(file.size)}
</td>

<td>
<button
 class="btn btn-sm btn-outline-danger remove"
>
移除
</button>
</td>
`;


      tr.querySelector(".remove")
      .onclick =
      e => {

        e.stopPropagation();

        files.splice(index,1);

        renderFiles();

      };


      tr.ondragstart =
      () => {

        tr.classList.add(
          "dragging"
        );

      };


      tr.ondragend =
      () => {

        tr.classList.remove(
          "dragging"
        );

        syncOrder();

      };


      tr.ondragover =
      e => {

        e.preventDefault();

        const dragging =
        document.querySelector(
          ".file-row.dragging"
        );

        if(
          !dragging ||
          dragging===tr
        )
          return;

        const rect =
        tr.getBoundingClientRect();

        if(
          e.clientY >
          rect.top+
          rect.height/2
        ){

          tr.after(dragging);

        }else{

          tr.before(dragging);

        }

      };


      fileList.appendChild(tr);

    }
  );

}


function syncOrder(){

  const newFiles=[];

  fileList
  .querySelectorAll(".file-row")
  .forEach(row => {

    newFiles.push(
      files[
        Number(row.dataset.index)
      ]
    );

  });

  files=newFiles;

  renderFiles();

}


clearBtn.onclick =
() => {

  files=[];

  renderFiles();

  logBox.innerHTML="";

  progress(
    0,
    "等待開始"
  );

};


/* =========================================================
   解析 EPUB
========================================================= */

async function parseEPUB(file,index){

  log(
    `讀取 ${file.name}`
  );


  const zip =
  await JSZip.loadAsync(file);


  const containerEntry =
  zip.file(
    "META-INF/container.xml"
  );


  if(!containerEntry)
    throw new Error(
      `${file.name}：缺少 container.xml`
    );


  const containerXML =
  await containerEntry.async(
    "text"
  );


  const parser =
  new DOMParser();


  const containerDoc =
  parser.parseFromString(
    containerXML,
    "application/xml"
  );


  if(
    containerDoc.querySelector(
      "parsererror"
    )
  )
    throw new Error(
      `${file.name}：container.xml 錯誤`
    );


  const rootfile =
  containerDoc.querySelector(
    "rootfile"
  );


  const opfPath =
  rootfile?.getAttribute(
    "full-path"
  );


  if(!opfPath)
    throw new Error(
      `${file.name}：找不到 OPF`
    );


  const opfEntry =
  zip.file(opfPath);


  if(!opfEntry)
    throw new Error(
      `${file.name}：找不到 OPF`
    );


  const opfXML =
  await opfEntry.async(
    "text"
  );


  const opfDoc =
  parser.parseFromString(
    opfXML,
    "application/xml"
  );


  if(
    opfDoc.querySelector(
      "parsererror"
    )
  )
    throw new Error(
      `${file.name}：OPF XML 錯誤`
    );


  const opfDir =
  dirname(opfPath);


  /*
   * Manifest
   */

  const manifest =
  new Map();


  opfDoc
  .querySelectorAll(
    "manifest > item"
  )
  .forEach(item => {

    const id =
    item.getAttribute("id");

    const href =
    item.getAttribute("href");

    if(!id || !href)
      return;


    const path =
    resolvePath(
      opfDir,
      href
    );


    manifest.set(
      id,
      {

        id,

        href,

        path,

        mediaType:
        item.getAttribute(
          "media-type"
        ) ||
        mediaType(path),

        properties:
        item.getAttribute(
          "properties"
        ) || "",

        mediaOverlay:
        item.getAttribute(
          "media-overlay"
        ) || null

      }
    );

  });


  /*
   * Spine
   */

  const spine=[];

  opfDoc
  .querySelector("spine")
  ?.querySelectorAll(
    ":scope > itemref"
  )
  .forEach(ref => {

    const idref =
    ref.getAttribute(
      "idref"
    );

    const item =
    manifest.get(idref);

    if(!item)
      return;


    spine.push({

      idref,

      item,

      linear:
      ref.getAttribute(
        "linear"
      ) || "yes",

      properties:
      ref.getAttribute(
        "properties"
      ) || ""

    });

  });


  /*
   * 書名
   */

  let title =
  file.name.replace(
    /\.epub$/i,
    ""
  );


  const titleNode =
  opfDoc.querySelector(
    "metadata title"
  );


  if(
    titleNode?.textContent?.trim()
  )
    title =
    titleNode.textContent.trim();


  /*
   * 封面
   *
   * 優先：
   *
   * 1. EPUB3 properties="cover-image"
   * 2. EPUB2 meta name="cover"
   * 3. 檔名 cover.*
   */

  let coverItem=null;


  for(
    const item of manifest.values()
  ){

    const props =
    item.properties
    .split(/\s+/);

    if(
      props.includes(
        "cover-image"
      )
    ){

      coverItem=item;

      break;

    }

  }


  if(!coverItem){

    const meta =
    opfDoc.querySelector(
      'metadata meta[name="cover"]'
    );


    const coverId =
    meta?.getAttribute(
      "content"
    );


    if(coverId)
      coverItem =
      manifest.get(
        coverId
      ) || null;

  }


  if(!coverItem){

    for(
      const item of manifest.values()
    ){

      if(
        /(^|\/)cover[^/]*\.(jpg|jpeg|png|webp)$/i
        .test(item.path)
      ){

        coverItem=item;

        break;

      }

    }

  }


  if(coverItem){

    log(
      `${file.name} 封面：${coverItem.path}`
    );

  }else{

    log(
      `${file.name}：沒有偵測到封面`
    );

  }


  /*
   * 所有實際檔案
   */

  const entries=[];


  for(
    const entry of
    Object.values(zip.files)
  ){

    if(entry.dir)
      continue;


    const path =
    normalizePath(
      entry.name
    );


    if(path==="mimetype")
      continue;


    if(
      path.startsWith(
        "META-INF/"
      )
    )
      continue;


    entries.push({

      entry,

      path

    });

  }


  return {

    file,

    index,

    zip,

    title,

    opfPath,

    opfDir,

    manifest,

    spine,

    coverItem,

    entries,

    prefix:
    `books/${String(index).padStart(3,"0")}`

  };

}


/* =========================================================
   合併
========================================================= */

async function mergeEPUBs(){

  if(!files.length)
    return;


  mergeBtn.disabled=true;

  clearBtn.disabled=true;

  logBox.innerHTML="";


  try{

    /* ---------------------------------------------
       1. 解析
    --------------------------------------------- */

    const books=[];


    for(
      let i=0;
      i<files.length;
      i++
    ){

      progress(
        i/files.length*20,
        `解析 EPUB ${i+1}/${files.length}`
      );


      books.push(
        await parseEPUB(
          files[i],
          i+1
        )
      );

    }


    /*
     * 工作 ZIP
     */

    const zip =
    new JSZip();


    /*
     * 最終 Manifest
     */

    const newManifest=[];

    const newSpine=[];


    /*
     * 每一本書的 item ID 對照表
     */

    const idMap =
    new Map();


    /* ---------------------------------------------
       2. 複製檔案 + 建立 Manifest
    --------------------------------------------- */

    for(
      let bi=0;
      bi<books.length;
      bi++
    ){

      const book =
      books[bi];


      log(
        `處理第 ${bi+1} 本：${book.title}`
      );


      /*
       * 複製實際檔案
       */

      for(
        const entry of book.entries
      ){

        const target =
        `${book.prefix}/${entry.path}`;


        const data =
        await entry.entry.async(
          "uint8array"
        );


        zip.file(
          target,
          data
        );

      }


      /*
       * Manifest
       */

      for(
        const item of
        book.manifest.values()
      ){

        const newId =
        `b${bi+1}_${item.id}`;


        /*
         * 注意：
         *
         * href 是相對於新的
         * EPUB/content.opf
         *
         * 所以必須用 relativePath()
         */

        const absoluteTarget =
        `${book.prefix}/${item.path}`;


        const href =
        relativePath(
          "EPUB/content.opf",
          absoluteTarget
        );


        let properties =
        item.properties || "";


        /*
         * 第一冊封面
         */

        if(
          bi===0 &&
          book.coverItem &&
          item.id ===
          book.coverItem.id
        ){

          const props =
          new Set(
            properties
            .split(/\s+/)
            .filter(Boolean)
          );


          props.add(
            "cover-image"
          );


          properties =
          [...props].join(" ");


          log(
            `設定合併後封面：${absoluteTarget}`
          );

        }


        const newItem={

          id:newId,

          href,

          mediaType:
          item.mediaType,

          properties,

          original:
          item

        };


        newManifest.push(
          newItem
        );


        idMap.set(
          `${bi}:${item.id}`,
          newItem
        );

      }


      /*
       * Spine
       */

      for(
        const ref of book.spine
      ){

        const item =
        idMap.get(
          `${bi}:${ref.idref}`
        );


        if(!item)
          continue;


        newSpine.push({

          idref:item.id,

          linear:
          ref.linear,

          properties:
          ref.properties

        });

      }


      progress(
        20+
        ((bi+1)/books.length)*50,
        `複製第 ${bi+1} 本 EPUB`
      );

    }


    /* ---------------------------------------------
       3. 找第一本封面 ID
    --------------------------------------------- */

    let coverId=null;


    if(
      books[0]?.coverItem
    ){

      const cover =
      idMap.get(
        `0:${books[0].coverItem.id}`
      );


      if(cover)
        coverId =
        cover.id;

    }


    /* ---------------------------------------------
       4. Manifest XML
    --------------------------------------------- */

    let manifestXML =
    `
<item
 id="nav"
 href="nav.xhtml"
 media-type="application/xhtml+xml"
 properties="nav"/>
`;


    for(
      const item of newManifest
    ){

      let attrs="";


      if(item.properties){

        attrs +=
        ` properties="${esc(
          item.properties
        )}"`;

      }


      /*
       * Media Overlay
       *
       * 原本的 media-overlay ID
       * 必須轉成新的 ID。
       */

      if(
        item.original.mediaOverlay
      ){

        const overlay =
        idMap.get(
          /*
           * 找出這個 item 屬於哪一本
           */
          [...idMap.entries()]
          .find(
            ([key,value]) =>
              value===item
          )?.[0]
          ?.split(":")
          ?.slice(0,1)
          ?.join(":") +
          ":" +
          item.original.mediaOverlay
        );


        if(overlay){

          attrs +=
          ` media-overlay="${esc(
            overlay.id
          )}"`;

        }

      }


      manifestXML += `

<item
 id="${esc(item.id)}"
 href="${esc(item.href)}"
 media-type="${esc(item.mediaType)}"${attrs}
/>

`;

    }


    /* ---------------------------------------------
       5. Spine XML
    --------------------------------------------- */

    let spineXML="";


    for(
      const item of newSpine
    ){

      spineXML += `

<itemref
 idref="${esc(item.idref)}"
 linear="${esc(item.linear)}"
${item.properties
 ? ` properties="${esc(item.properties)}"`
 : ""}
 />

`;

    }


    /* ---------------------------------------------
       6. OPF
    --------------------------------------------- */

		const mergedTitle =
			books[0]?.title ||
			files[0]?.name.replace(/\.epub$/i,"") ||
			"Merged EPUB";

		let metadataXML = `

		<dc:identifier id="bookid">
		merged-${Date.now()}
		</dc:identifier>

		<dc:title>
		${esc(mergedTitle)}
		</dc:title>

		<dc:language>
		zh-TW
		</dc:language>

		`;


    /*
     * EPUB2 cover metadata
     */

    if(coverId){

      metadataXML += `

<meta
 name="cover"
 content="${esc(coverId)}"
/>

`;

    }


    const opf = `<?xml version="1.0" encoding="UTF-8"?>

<package
 xmlns="http://www.idpf.org/2007/opf"
 version="3.0"
 unique-identifier="bookid"
>

<metadata
 xmlns:dc="http://purl.org/dc/elements/1.1/"
>

${metadataXML}

</metadata>

<manifest>

${manifestXML}

</manifest>

<spine>

${spineXML}

</spine>

</package>
`;


    zip.file(
      "EPUB/content.opf",
      opf
    );


    /* ---------------------------------------------
       7. 建立 TOC
    --------------------------------------------- */

    let navXML="";


    for(
      let bi=0;
      bi<books.length;
      bi++
    ){

      const book =
      books[bi];


      navXML += `

<li>

<span>
${esc(book.title)}
</span>

<ol>

`;


      for(
        let ci=0;
        ci<book.spine.length;
        ci++
      ){

        const ref =
        book.spine[ci];


        /*
         * 原 XHTML 在合併後的絕對位置
         */

        const absoluteTarget =
        `${book.prefix}/${ref.item.path}`;


        /*
         * nav.xhtml 的 href
         */

        const href =
        relativePath(
          "EPUB/nav.xhtml",
          absoluteTarget
        );


        /*
         * 取得 XHTML 標題
         */

        let label =
        `第 ${ci+1} 章`;


        const entry =
        zip.file(
          absoluteTarget
        );


        if(entry){

          try{

            const text =
            await entry.async(
              "text"
            );


            const parser =
            new DOMParser();


            const doc =
            parser.parseFromString(
              text,
              "application/xhtml+xml"
            );


            const node =
            doc.querySelector(
              "title"
            ) ||
            doc.querySelector(
              "h1,h2,h3"
            );


            if(
              node?.textContent?.trim()
            ){

              label =
              node.textContent.trim();

            }

          }catch(e){

            console.warn(
              "讀取章節標題失敗",
              absoluteTarget,
              e
            );

          }

        }


        navXML += `

<li>

<a href="${esc(href)}">
${esc(label)}
</a>

</li>

`;

      }


      navXML += `

</ol>

</li>

`;

    }


    const nav = `<?xml version="1.0" encoding="UTF-8"?>

<!DOCTYPE html>

<html
 xmlns="http://www.w3.org/1999/xhtml"
 xmlns:epub="http://www.idpf.org/2007/ops"
>

<head>

<meta charset="utf-8"/>

<title>目錄</title>

</head>

<body>

<nav
 epub:type="toc"
 id="toc"
>

<h1>目錄</h1>

<ol>

${navXML}

</ol>

</nav>

</body>

</html>
`;


    zip.file(
      "EPUB/nav.xhtml",
      nav
    );


    progress(
      80,
      "建立 EPUB 結構"
    );


    /* ---------------------------------------------
       8. 建立最終 ZIP
    --------------------------------------------- */

    const finalZip =
    new JSZip();


    /*
     * EPUB 規範：
     * mimetype 必須第一個且 STORE
     */

    finalZip.file(
      "mimetype",
      "application/epub+zip",
      {
        compression:"STORE"
      }
    );


    /*
     * container
     */

    finalZip.file(
      "META-INF/container.xml",

`<?xml version="1.0" encoding="UTF-8"?>

<container
 version="1.0"
 xmlns="urn:oasis:names:tc:opendocument:xmlns:container"
>

<rootfiles>

<rootfile
 full-path="EPUB/content.opf"
 media-type="application/oebps-package+xml"
/>

</rootfiles>

</container>
`
    );


    /*
     * 複製所有內容
     */

    const entries =
    Object.values(
      zip.files
    );


    for(
      let i=0;
      i<entries.length;
      i++
    ){

      const entry =
      entries[i];


      if(entry.dir)
        continue;


      const data =
      await entry.async(
        "uint8array"
      );


      finalZip.file(
        entry.name,
        data
      );


      progress(
        80+
        ((i+1)/entries.length)*17,
        `打包 ${i+1}/${entries.length}`
      );

    }


    /* ---------------------------------------------
       9. 產生 EPUB
    --------------------------------------------- */

    progress(
      98,
      "產生 EPUB..."
    );


    const blob =
    await finalZip.generateAsync({

      type:"blob",

      mimeType:
      "application/epub+zip",

      compression:"DEFLATE",

      compressionOptions:{
        level:6
      }

    });


    /* ---------------------------------------------
       10. 下載
    --------------------------------------------- */

		let filename =
			outputName.value.trim();

		if(!filename){

			filename =
				mergedTitle
					.replace(/[\\/:*?"<>|]/g,"_")
					.trim() ||
				"merged";

		}

		if(
			!/\.epub$/i.test(filename)
		)
			filename += ".epub";


    const url =
    URL.createObjectURL(
      blob
    );


    const a =
    document.createElement(
      "a"
    );


    a.href=url;

    a.download=filename;

    document.body.appendChild(a);

    a.click();

    a.remove();


    setTimeout(
      () =>
      URL.revokeObjectURL(url),
      10000
    );


    progress(
      100,
      "合併完成"
    );


    log(
      `完成：${filename}`
    );


    log(
      `輸出大小：${formatSize(blob.size)}`
    );


    alert(
      "合併完成！\n\n"+
      `書籍：${books.length} 本\n`+
      `輸出：${formatSize(blob.size)}\n`+
      `封面：${
        coverId
        ? "第一本 EPUB"
        : "未偵測到"
      }`
    );


  }catch(error){

    console.error(
      error
    );


    progress(
      0,
      "合併失敗"
    );


    log(
      "錯誤："+(
        error.stack ||
        error.message ||
        error
      )
    );


    alert(
      "合併失敗：\n\n"+
      (
        error.message ||
        error
      )
    );


  }finally{

    mergeBtn.disabled =
    files.length===0;

    clearBtn.disabled =
    files.length===0;

  }

}


mergeBtn.onclick =
mergeEPUBs;


renderFiles();

</script>

</body>

</html>
