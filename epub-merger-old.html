<script type="module">

import JSZip from
"https://cdn.jsdelivr.net/npm/jszip@3.10.1/+esm";


/* =====================================================
   DOM
===================================================== */

const $ =
s => document.querySelector(s);


const fileInput =
$("#fileInput");

const selectBtn =
$("#selectBtn");

const dropZone =
$("#dropZone");

const fileList =
$("#fileList");

const emptyMessage =
$("#emptyMessage");

const fileTableWrapper =
$("#fileTableWrapper");

const clearBtn =
$("#clearBtn");

const mergeBtn =
$("#mergeBtn");

const outputName =
$("#outputName");

const progressBar =
$("#progressBar");

const progressText =
$("#progressText");

const statusText =
$("#statusText");

const logBox =
$("#log");


let files=[];


/* =====================================================
   基本工具
===================================================== */

function log(text){

  const div =
  document.createElement("div");

  div.textContent =
  `[${new Date().toLocaleTimeString()}] ${text}`;

  logBox.appendChild(div);

  logBox.scrollTop =
  logBox.scrollHeight;

}


function progress(value,text){

  value =
  Math.max(
    0,
    Math.min(100,value)
  );

  progressBar.style.width =
  value+"%";

  progressBar.textContent =
  Math.round(value)+"%";

  progressText.textContent =
  Math.round(value)+"%";

  if(text)
    statusText.textContent =
    text;

}


function esc(value){

  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&apos;");

}


function normalizePath(path){

  const result=[];

  for(
    const part of
    String(path || "")
      .replace(/\\/g,"/")
      .split("/")
  ){

    if(
      !part ||
      part=="."
    )
      continue;

    if(part=="..")
      result.pop();
    else
      result.push(part);

  }

  return result.join("/");

}


function dirname(path){

  const i =
  path.lastIndexOf("/");

  return i<0
    ? ""
    : path.slice(0,i);

}


function resolvePath(base,href){

  href =
  String(href || "")
    .split("#")[0]
    .split("?")[0];

  return normalizePath(
    base
      ? base+"/"+href
      : href
  );

}


function formatSize(bytes){

  if(bytes<1024)
    return bytes+" B";

  if(bytes<1024*1024)
    return (
      bytes/1024
    ).toFixed(1)+" KB";

  return (
    bytes/1024/1024
  ).toFixed(2)+" MB";

}


function getMediaType(path){

  const ext =
  (path.match(/\.[^.\/]+$/)||[""])[0]
    .toLowerCase();

  const map={

    ".xhtml":
      "application/xhtml+xml",

    ".html":
      "application/xhtml+xml",

    ".htm":
      "application/xhtml+xml",

    ".css":
      "text/css",

    ".jpg":
      "image/jpeg",

    ".jpeg":
      "image/jpeg",

    ".png":
      "image/png",

    ".gif":
      "image/gif",

    ".webp":
      "image/webp",

    ".svg":
      "image/svg+xml",

    ".avif":
      "image/avif",

    ".mp3":
      "audio/mpeg",

    ".m4a":
      "audio/mp4",

    ".aac":
      "audio/aac",

    ".ogg":
      "audio/ogg",

    ".oga":
      "audio/ogg",

    ".wav":
      "audio/wav",

    ".mp4":
      "video/mp4",

    ".webm":
      "video/webm",

    ".smil":
      "application/smil+xml",

    ".ncx":
      "application/x-dtbncx+xml",

    ".woff":
      "font/woff",

    ".woff2":
      "font/woff2",

    ".ttf":
      "font/ttf",

    ".otf":
      "font/otf",

    ".js":
      "application/javascript"

  };

  return map[ext] ||
    "application/octet-stream";

}


/* =====================================================
   檔案選擇
===================================================== */

selectBtn.onclick =
() => fileInput.click();


dropZone.onclick =
e => {

  if(e.target!==selectBtn)
    fileInput.click();

};


fileInput.onchange =
e => {

  addFiles(
    [...e.target.files]
  );

  fileInput.value="";

};


dropZone.ondragover =
e => {

  e.preventDefault();

  dropZone.classList.add(
    "dragover"
  );

};


dropZone.ondragleave =
() => {

  dropZone.classList.remove(
    "dragover"
  );

};


dropZone.ondrop =
e => {

  e.preventDefault();

  dropZone.classList.remove(
    "dragover"
  );

  addFiles(
    [...e.dataTransfer.files]
      .filter(
        f =>
          /\.epub$/i.test(f.name)
      )
  );

};


function addFiles(newFiles){

  for(
    const file of newFiles
  ){

    if(
      !/\.epub$/i.test(file.name)
    )
      continue;

    if(
      files.some(
        f =>
          f.name===file.name &&
          f.size===file.size &&
          f.lastModified===file.lastModified
      )
    )
      continue;

    files.push(file);

  }

  renderFiles();

}


/* =====================================================
   檔案列表
===================================================== */

function renderFiles(){

  fileList.innerHTML="";


  if(!files.length){

    emptyMessage.classList.remove(
      "d-none"
    );

    fileTableWrapper.classList.add(
      "d-none"
    );

    mergeBtn.disabled=true;

    clearBtn.disabled=true;

    return;

  }


  emptyMessage.classList.add(
    "d-none"
  );

  fileTableWrapper.classList.remove(
    "d-none"
  );

  mergeBtn.disabled=false;

  clearBtn.disabled=false;


  files.forEach(
    (file,index) => {

      const tr =
      document.createElement("tr");

      tr.className=
        "file-row";

      tr.draggable=true;

      tr.dataset.index=index;


      tr.innerHTML=`

<td class="text-center">
<span class="handle">☰</span>
</td>

<td>
<span class="badge text-bg-primary">
${index+1}
</span>
</td>

<td>
<div class="fw-semibold">
${esc(file.name)}
</div>
</td>

<td>
${formatSize(file.size)}
</td>

<td>
<button
 class="btn btn-sm btn-outline-danger remove"
>
移除
</button>
</td>

`;


      tr.querySelector(
        ".remove"
      ).onclick =
      e => {

        e.stopPropagation();

        files.splice(
          index,
          1
        );

        renderFiles();

      };


      tr.ondragstart =
      () =>
        tr.classList.add(
          "dragging"
        );


      tr.ondragend =
      () => {

        tr.classList.remove(
          "dragging"
        );

        syncOrder();

      };


      tr.ondragover =
      e => {

        e.preventDefault();

        const dragging =
        document.querySelector(
          ".file-row.dragging"
        );

        if(
          !dragging ||
          dragging===tr
        )
          return;


        const rect =
        tr.getBoundingClientRect();


        if(
          e.clientY >
          rect.top+
          rect.height/2
        )
          tr.after(dragging);
        else
          tr.before(dragging);

      };


      fileList.appendChild(tr);

    }
  );

}


function syncOrder(){

  const newFiles=[];


  fileList
    .querySelectorAll(
      ".file-row"
    )
    .forEach(row => {

      newFiles.push(
        files[
          Number(
            row.dataset.index
          )
        ]
      );

    });


  files=newFiles;

  renderFiles();

}


clearBtn.onclick =
() => {

  files=[];

  renderFiles();

  logBox.innerHTML="";

  progress(
    0,
    "等待開始"
  );

};


/* =====================================================
   解析 EPUB
===================================================== */

async function parseEPUB(
  file,
  index
){

  const zip =
    await JSZip.loadAsync(file);


  const containerEntry =
    zip.file(
      "META-INF/container.xml"
    );


  if(!containerEntry)
    throw new Error(
      `${file.name} 缺少 container.xml`
    );


  const containerXML =
    await containerEntry.async(
      "text"
    );


  const parser =
    new DOMParser();


  const containerDoc =
    parser.parseFromString(
      containerXML,
      "application/xml"
    );


  const rootfile =
    containerDoc.querySelector(
      "rootfile"
    );


  const opfPath =
    rootfile?.getAttribute(
      "full-path"
    );


  if(!opfPath)
    throw new Error(
      `${file.name} 找不到 OPF`
    );


  const opfEntry =
    zip.file(opfPath);


  if(!opfEntry)
    throw new Error(
      `${file.name} 找不到 OPF`
    );


  const opfXML =
    await opfEntry.async(
      "text"
    );


  const opfDoc =
    parser.parseFromString(
      opfXML,
      "application/xml"
    );


  if(
    opfDoc.querySelector(
      "parsererror"
    )
  )
    throw new Error(
      `${file.name} OPF XML 錯誤`
    );


  const opfDir =
    dirname(opfPath);


  /*
   * Manifest
   */

  const manifest =
    new Map();


  opfDoc
    .querySelectorAll(
      "manifest > item"
    )
    .forEach(item => {

      const id =
        item.getAttribute("id");

      const href =
        item.getAttribute("href");


      if(!id || !href)
        return;


      const path =
        resolvePath(
          opfDir,
          href
        );


      manifest.set(
        id,
        {

          id,

          href,

          path,

          mediaType:
            item.getAttribute(
              "media-type"
            ) ||
            getMediaType(path),

          properties:
            item.getAttribute(
              "properties"
            ) || "",

          mediaOverlay:
            item.getAttribute(
              "media-overlay"
            ) || null

        }
      );

    });


  /*
   * Spine
   */

  const spine=[];


  opfDoc
    .querySelector("spine")
    ?.querySelectorAll(
      ":scope > itemref"
    )
    .forEach(ref => {

      const idref =
        ref.getAttribute(
          "idref"
        );


      const item =
        manifest.get(idref);


      if(!item)
        return;


      spine.push({

        idref,

        item,

        linear:
          ref.getAttribute(
            "linear"
          ) || "yes",

        properties:
          ref.getAttribute(
            "properties"
          ) || ""

      });

    });


  /*
   * 書名
   */

  let title =
    file.name.replace(
      /\.epub$/i,
      ""
    );


  const titleNode =
    opfDoc.querySelector(
      "metadata title"
    );


  if(
    titleNode?.textContent?.trim()
  )
    title =
      titleNode.textContent.trim();


  /*
   * 作者
   */

  let creator="";


  const creatorNode =
    opfDoc.querySelector(
      "metadata creator"
    );


  if(
    creatorNode?.textContent?.trim()
  )
    creator =
      creatorNode.textContent.trim();


  /*
   * 語言
   */

  let language="zh-TW";


  const languageNode =
    opfDoc.querySelector(
      "metadata language"
    );


  if(
    languageNode?.textContent?.trim()
  )
    language =
      languageNode.textContent.trim();


  /*
   * 封面
   */

  let coverItem=null;


  for(
    const item of manifest.values()
  ){

    if(
      item.properties
        .split(/\s+/)
        .includes(
          "cover-image"
        )
    ){

      coverItem=item;

      break;

    }

  }


  /*
   * EPUB 2 cover
   */

  if(!coverItem){

    const meta =
      opfDoc.querySelector(
        'metadata meta[name="cover"]'
      );


    const coverId =
      meta?.getAttribute(
        "content"
      );


    if(coverId)
      coverItem =
        manifest.get(
          coverId
        ) || null;

  }


  /*
   * 檔名猜測
   */

  if(!coverItem){

    for(
      const item of manifest.values()
    ){

      if(
        /(^|\/)cover[^/]*\.(jpg|jpeg|png|webp)$/i
          .test(item.path)
      ){

        coverItem=item;

        break;

      }

    }

  }


  if(coverItem){

    log(
      `${file.name} 封面：${coverItem.path}`
    );

  }else{

    log(
      `${file.name} 沒有找到封面`
    );

  }


  /*
   * 實際檔案
   */

  const entries=[];


  for(
    const entry of
    Object.values(zip.files)
  ){

    if(entry.dir)
      continue;


    const path =
      normalizePath(
        entry.name
      );


    if(
      path==="mimetype"
    )
      continue;


    if(
      path.startsWith(
        "META-INF/"
      )
    )
      continue;


    entries.push({

      entry,

      path

    });

  }


  return {

    file,

    index,

    zip,

    title,

    creator,

    language,

    opfPath,

    opfDir,

    manifest,

    spine,

    coverItem,

    entries

  };

}


/* =====================================================
   產生 NCX
===================================================== */

function createNCX(
  books
){

  let playOrder=1;

  let points="";


  for(
    let bi=0;
    bi<books.length;
    bi++
  ){

    const book =
      books[bi];


    let children="";


    for(
      let ci=0;
      ci<book.spine.length;
      ci++
    ){

      const ref =
        book.spine[ci];


      const target =
        `books/${String(
          bi+1
        ).padStart(3,"0")}/${ref.item.path}`;


      const label =
        `${ci+1}. ${
          ref.item.href
            .split("/")
            .pop()
            .replace(
              /\.[^.]+$/,
              ""
            )
        }`;


      children += `

<navPoint
 id="navPoint-${playOrder}"
 playOrder="${playOrder}"
>

<navLabel>

<text>
${esc(label)}
</text>

</navLabel>

<content
 src="${esc(target)}"
/>

</navPoint>

`;


      playOrder++;

    }


    points += `

<navPoint
 id="book-${bi+1}"
 playOrder="${playOrder}"
>

<navLabel>

<text>
${esc(book.title)}
</text>

</navLabel>

<content
 src="#"
/>

${children}

</navPoint>

`;

  }


  return `<?xml version="1.0" encoding="UTF-8"?>

<!DOCTYPE ncx
 PUBLIC "-//NISO//DTD ncx 2005-1//EN"
 "http://www.daisy.org/z3986/2005/ncx-2005-1.dtd"
>

<ncx
 xmlns="http://www.daisy.org/z3986/2005/ncx/"
 version="2005-1"
>

<head>

<meta
 name="dtb:uid"
 content="merged-book"
/>

<meta
 name="dtb:depth"
 content="2"
/>

<meta
 name="dtb:totalPageCount"
 content="0"
/>

<meta
 name="dtb:maxPageNumber"
 content="0"
/>

</head>

<docTitle>

<text>
${esc(books[0]?.title || "合併 EPUB")}
</text>

</docTitle>

<navMap>

${points}

</navMap>

</ncx>
`;

}


/* =====================================================
   合併
===================================================== */

async function mergeEPUBs(){

  if(!files.length)
    return;


  mergeBtn.disabled=true;

  clearBtn.disabled=true;

  logBox.innerHTML="";


  try{

    /*
     * 1. 解析所有 EPUB
     */

    const books=[];


    for(
      let i=0;
      i<files.length;
      i++
    ){

      progress(
        i/files.length*15,
        `解析第 ${i+1}/${files.length} 本`
      );


      const book =
        await parseEPUB(
          files[i],
          i+1
        );


      books.push(book);


      log(
        `${book.title}：${book.spine.length} 個 spine item`
      );

    }


    /*
     * 第一冊
     */

    const first =
      books[0];


    const mergedTitle =
      first.title ||
      first.file.name.replace(
        /\.epub$/i,
        ""
      );


    /*
     * 最終 ZIP
     */

    const zip =
      new JSZip();


    /*
     * mimetype 必須第一個
     */

    zip.file(
      "mimetype",
      "application/epub+zip",
      {
        compression:"STORE"
      }
    );


    /*
     * container.xml
     */

    zip.file(
      "META-INF/container.xml",

`<?xml version="1.0" encoding="UTF-8"?>

<container
 version="1.0"
 xmlns="urn:oasis:names:tc:opendocument:xmlns:container"
>

<rootfiles>

<rootfile
 full-path="EPUB/content.opf"
 media-type="application/oebps-package+xml"
/>

</rootfiles>

</container>
`
    );


    /*
     * Manifest / Spine
     */

    const manifest=[];

    const spine=[];


    let coverId=null;


    /*
     * 2. 複製所有 EPUB
     */

    for(
      let bi=0;
      bi<books.length;
      bi++
    ){

      const book =
        books[bi];


      /*
       * 非常重要：
       *
       * 所有內容都放進 EPUB/
       */

      const prefix =
        `EPUB/books/${String(
          bi+1
        ).padStart(3,"0")}`;


      log(
        `複製：${book.title}`
      );


      /*
       * 複製實際檔案
       */

      for(
        const entry of book.entries
      ){

        const target =
          `${prefix}/${entry.path}`;


        const data =
          await entry.entry.async(
            "uint8array"
          );


        zip.file(
          target,
          data
        );

      }


      /*
       * Manifest
       */

      for(
        const item of
        book.manifest.values()
      ){

        const newId =
          `b${bi+1}_${item.id}`;


        /*
         * OPF 在 EPUB/
         *
         * 所以：
         *
         * EPUB/content.opf
         *
         * →
         *
         * EPUB/books/001/...
         *
         * 只需要：
         *
         * books/001/...
         */

        const href =
          `books/${String(
            bi+1
          ).padStart(3,"0")}/${item.path}`;


        let properties =
          item.properties;


        /*
         * 第一冊封面
         */

        if(
          bi===0 &&
          book.coverItem &&
          item.id===
            book.coverItem.id
        ){

          const set =
            new Set(
              properties
                .split(/\s+/)
                .filter(Boolean)
            );


          set.add(
            "cover-image"
          );


          properties =
            [...set].join(" ");


          coverId =
            newId;


          log(
            `★ 合併封面：${href}`
          );

        }


        /*
         * Media Overlay
         */

        let mediaOverlay="";


        if(
          item.mediaOverlay
        ){

          mediaOverlay =
            ` media-overlay="${
              esc(
                `b${bi+1}_${item.mediaOverlay}`
              )
            }"`;

        }


        manifest.push({

          id:newId,

          href,

          mediaType:
            item.mediaType,

          properties,

          mediaOverlay

        });

      }


      /*
       * Spine
       */

      for(
        const ref of book.spine
      ){

        spine.push({

          idref:
            `b${bi+1}_${ref.idref}`,

          linear:
            ref.linear,

          properties:
            ref.properties

        });

      }


      progress(
        15+
        (bi+1)/
        books.length*
        50,

        `複製第 ${bi+1}/${books.length} 本`
      );

    }


    /*
     * 3. Manifest XML
     */

    let manifestXML="";


    /*
     * nav.xhtml
     */

    manifestXML += `

<item
 id="nav"
 href="nav.xhtml"
 media-type="application/xhtml+xml"
 properties="nav"
/>

`;


    /*
     * toc.ncx
     */

    manifestXML += `

<item
 id="ncx"
 href="toc.ncx"
 media-type="application/x-dtbncx+xml"
/>

`;


    for(
      const item of manifest
    ){

      manifestXML += `

<item
 id="${esc(item.id)}"
 href="${esc(item.href)}"
 media-type="${esc(item.mediaType)}"${
 item.properties
   ? ` properties="${esc(item.properties)}"`
   : ""
 }${item.mediaOverlay}
/>

`;

    }


    /*
     * 4. Spine
     */

    let spineXML="";


    for(
      const item of spine
    ){

      spineXML += `

<itemref
 idref="${esc(item.idref)}"
 linear="${esc(item.linear)}"${
 item.properties
   ? ` properties="${esc(item.properties)}"`
   : ""
 }
/>

`;

    }


    /*
     * 5. Metadata
     */

    let metadataXML=`

<dc:identifier id="bookid">
merged-${Date.now()}
</dc:identifier>

<dc:title>
${esc(mergedTitle)}
</dc:title>

<dc:language>
${esc(first.language || "zh-TW")}
</dc:language>

`;


    if(first.creator){

      metadataXML += `

<dc:creator>
${esc(first.creator)}
</dc:creator>

`;

    }


    /*
     * EPUB 2 cover
     */

    if(coverId){

      metadataXML += `

<meta
 name="cover"
 content="${esc(coverId)}"
/>

`;

    }


    /*
     * 6. content.opf
     */

    const opf =
`<?xml version="1.0" encoding="UTF-8"?>

<package
 xmlns="http://www.idpf.org/2007/opf"
 version="3.0"
 unique-identifier="bookid"
>

<metadata
 xmlns:dc="http://purl.org/dc/elements/1.1/"
>

${metadataXML}

</metadata>

<manifest>

${manifestXML}

</manifest>

<spine
 toc="ncx"
>

${spineXML}

</spine>

</package>
`;


    zip.file(
      "EPUB/content.opf",
      opf
    );


    /*
     * 7. 建立 nav.xhtml
     */

    let navBooks="";


    for(
      let bi=0;
      bi<books.length;
      bi++
    ){

      const book =
        books[bi];


      let chapterList="";


      for(
        let ci=0;
        ci<book.spine.length;
        ci++
      ){

        const ref =
          book.spine[ci];


        const href =
          `books/${String(
            bi+1
          ).padStart(3,"0")}/${ref.item.path}`;


        /*
         * 從 XHTML 取得 title
         */

        let chapterTitle =
          ref.item.href
            .split("/")
            .pop()
            .replace(
              /\.[^.]+$/,
              ""
            );


        try{

          const entry =
            book.zip.file(
              ref.item.path
            );


          if(entry){

            const text =
              await entry.async(
                "text"
              );


            const doc =
              new DOMParser()
                .parseFromString(
                  text,
                  "application/xhtml+xml"
                );


            const title =
              doc.querySelector(
                "title"
              ) ||
              doc.querySelector(
                "h1,h2,h3"
              );


            if(
              title?.textContent?.trim()
            ){

              chapterTitle =
                title.textContent.trim();

            }

          }

        }catch(e){

          console.warn(
            "章節標題讀取失敗",
            e
          );

        }


        chapterList += `

<li>

<a href="${esc(href)}">

${esc(chapterTitle)}

</a>

</li>

`;

      }


      navBooks += `

<li>

<span>
${esc(book.title)}
</span>

<ol>

${chapterList}

</ol>

</li>

`;

    }


    const nav =
`<?xml version="1.0" encoding="UTF-8"?>

<!DOCTYPE html>

<html
 xmlns="http://www.w3.org/1999/xhtml"
 xmlns:epub="http://www.idpf.org/2007/ops"
>

<head>

<title>
${esc(mergedTitle)}
</title>

</head>

<body>

<nav
 epub:type="toc"
 id="toc"
>

<h1>
目錄
</h1>

<ol>

${navBooks}

</ol>

</nav>

</body>

</html>
`;


    zip.file(
      "EPUB/nav.xhtml",
      nav
    );


    /*
     * 8. toc.ncx
     */

    const ncx =
      createNCX(
        books
      );


    zip.file(
      "EPUB/toc.ncx",
      ncx
    );


    progress(
      75,
      "建立 TOC 與 EPUB 結構"
    );


    /*
     * 9. 產生 EPUB
     */

    const blob =
      await zip.generateAsync({

        type:"blob",

        mimeType:
          "application/epub+zip",

        compression:"DEFLATE",

        compressionOptions:{
          level:6
        },

        streamFiles:true

      },metadata => {

        progress(
          75+
          metadata.percent*0.23,
          "產生 EPUB..."
        );

      });


    /*
     * 10. 檔名
     */

    let filename =
      outputName.value.trim();


    if(!filename){

      filename =
        mergedTitle
          .replace(
            /[\\/:*?"<>|]/g,
            "_"
          )
          .trim() ||
        "merged";

    }


    if(
      !/\.epub$/i.test(filename)
    )
      filename +=
        ".epub";


    /*
     * 11. 下載
     */

    const url =
      URL.createObjectURL(
        blob
      );


    const a =
      document.createElement(
        "a"
      );


    a.href=url;

    a.download=filename;

    document.body.appendChild(a);

    a.click();

    a.remove();


    setTimeout(
      () =>
        URL.revokeObjectURL(url),
      10000
    );


    progress(
      100,
      "合併完成"
    );


    log(
      `完成：${filename}`
    );


    log(
      `書名：${mergedTitle}`
    );


    log(
      `章節：${spine.length}`
    );


    log(
      `封面：${
        coverId
          ? "第一本 EPUB"
          : "未找到"
      }`
    );


    log(
      `大小：${formatSize(blob.size)}`
    );


    alert(
      `合併完成！\n\n`+
      `書名：${mergedTitle}\n`+
      `章節：${spine.length}\n`+
      `封面：${
        coverId
          ? "第一本 EPUB"
          : "未找到"
      }\n`+
      `大小：${formatSize(blob.size)}`
    );


  }catch(error){

    console.error(
      error
    );


    progress(
      0,
      "合併失敗"
    );


    log(
      "ERROR: "+
      (
        error.stack ||
        error.message ||
        error
      )
    );


    alert(
      "合併失敗：\n\n"+
      (
        error.message ||
        error
      )
    );


  }finally{

    mergeBtn.disabled =
      files.length===0;

    clearBtn.disabled =
      files.length===0;

  }

}


mergeBtn.onclick =
mergeEPUBs;


renderFiles();

</script>

</body>

</html>
