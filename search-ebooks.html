<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>電子書圖書館搜尋</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
body{background:#f5f6f8}
.search-card{border:0;border-radius:14px}
.result-card{border:0;border-radius:12px;margin-bottom:12px}
.result-card:hover{box-shadow:0 4px 16px rgba(0,0,0,.08)}
.library-group{max-height:500px;overflow-y:auto}
.library-item{padding:4px 0}
.result-title{font-weight:600;line-height:1.5}
.platform-section{margin-bottom:28px}
.platform-title{font-size:1.15rem;font-weight:700;margin-bottom:12px}
.sticky-search{position:sticky;top:0;z-index:1000;background:#f5f6f8;padding-top:12px;padding-bottom:12px}
.form-check-label{cursor:pointer}
.library-link{font-size:.9rem;margin-right:6px;margin-bottom:5px}
</style>
</head>
<body>
<div class="container-fluid px-3 px-md-4">
<div class="sticky-search">
<div class="card search-card shadow-sm">
<div class="card-body">
<div class="row g-3 align-items-end">
<div class="col-12 col-lg-6">
<label for="searchInput" class="form-label fw-semibold">書名</label>
<div class="input-group input-group-lg">
<input type="text" id="searchInput" class="form-control" placeholder="輸入書名，例如：原子習慣" autocomplete="off">
<button id="searchButton" class="btn btn-primary" type="button">搜尋</button>
</div>
</div>
<div class="col-12 col-lg-6">
<div class="d-flex justify-content-between align-items-center mb-2">
<label class="form-label fw-semibold mb-0">搜尋平台</label>
<div>
<button id="selectAllPlatforms" class="btn btn-sm btn-outline-secondary" type="button">全選</button>
<button id="clearAllPlatforms" class="btn btn-sm btn-outline-secondary" type="button">全不選</button>
</div>
</div>
<div class="d-flex flex-wrap gap-3">
<div class="form-check"><input class="form-check-input platform-check" type="checkbox" value="public" id="platformPublic" checked><label class="form-check-label" for="platformPublic">國資圖</label></div>
<div class="form-check"><input class="form-check-input platform-check" type="checkbox" value="ebookservice" id="platformEbookservice" checked><label class="form-check-label" for="platformEbookservice">雲端書庫</label></div>
<div class="form-check"><input class="form-check-input platform-check" type="checkbox" value="udn" id="platformUdn" checked><label class="form-check-label" for="platformUdn">UDN</label></div>
<div class="form-check"><input class="form-check-input platform-check" type="checkbox" value="iread" id="platformIread" checked><label class="form-check-label" for="platformIread">iRead</label></div>
</div>
</div>
</div>
</div>
</div>
</div>
<div class="row g-4">
<div class="col-12 col-lg-3">
<div class="card shadow-sm border-0">
<div class="card-body">
<div class="d-flex justify-content-between align-items-center">
<h5 class="card-title mb-0">圖書館</h5>
<span id="libraryCount" class="badge text-bg-secondary">0</span>
</div>
<hr>
<div class="mb-3">
<button id="selectAllLibraries" class="btn btn-sm btn-outline-primary" type="button">全選</button>
<button id="clearAllLibraries" class="btn btn-sm btn-outline-secondary" type="button">全不選</button>
</div>
<div id="libraryList" class="library-group d-none"></div>
</div>
</div>
</div>
<div class="col-12 col-lg-9">
<div id="statusArea" class="mb-3"></div>
<div id="resultsArea"></div>
</div>
</div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
const RENDER_PROXY_BASE_URL="https://newsbeiter.onrender.com";
const PUBLIC_PROXY_BASE_URL="https://public-info-vercel-proxy-b8zlo0jpg-eddies-projects-5657f937.vercel.app";
const ebookserviceLibCodeMap={
"嘉義市":"cy","金門縣":"km","屏東縣":"pt","苗栗縣":"ml","雲林縣":"ylc","遠流出版公司雲端書庫":"Z00001","臺北市":"tpe","教育雲電子書":"oidc","新竹縣":"hcc","宜蘭縣":"il","南投縣":"ntc","國臺圖":"ntl2","臺東縣":"tt","臺中市":"tc","花蓮縣":"hl","彰化縣":"chc","新竹市":"hc","高雄市":"ks","新北市":"nt","桃園市":"ty","澎湖縣":"ph","臺南市":"tn","基隆市":"kl","嘉義縣":"cyc"
};
const udnLibCodeMap={
"嘉義市政府文化局":"cabcy","國家圖書館":"ncl","國立臺灣圖書館":"cwktrial","基隆市文化局":"klccab","彰化雲端電子書庫":"","新北市立圖書館":"tpc","新竹市圖書館":"","新竹縣政府文化局":"","桃園市立圖書館":"tyccc","澎湖縣圖書館":"phhcc","臺中市立圖書館":"taich","臺北市立圖書館":"tpml","臺南市立圖書館":"tnml","臺東縣政府文化處":"ttct","花蓮縣文化局":"hlshcc","苗栗市立圖書館":"","苗栗縣立圖書館":"miaoli","連江縣公共圖書館":"","金門縣文化局":"","高雄市立圖書館":"ksm"
};
const ireadLibraries=[
{name:"基隆市文化局",baseUrl:"https://klccab.airitibooks.com"},
{name:"國立臺灣圖書館",baseUrl:"https://ntl.airitibooks.com"},
{name:"國家圖書館",baseUrl:"https://ncl.airitibooks.com"},
{name:"桃園市立圖書館",baseUrl:"https://typl.airitibooks.com"},
{name:"新竹縣公共圖書館",baseUrl:"https://hchcc.airitibooks.com"},
{name:"新竹市圖書館",baseUrl:"https://hcccb.airitibooks.com"},
{name:"苗栗縣公共圖書館",baseUrl:"https://libml.airitibooks.com"},
{name:"臺中市立圖書館",baseUrl:"https://libtc.airitibooks.com"},
{name:"雲林縣政府文化處圖書館",baseUrl:"https://ylccb.airitibooks.com"},
{name:"花蓮縣公共圖書館",baseUrl:"https://hccc.airitibooks.com"},
{name:"臺東縣政府文化處圖書館",baseUrl:"https://cclttct.airitibooks.com"},
{name:"屏東縣公共圖書館",baseUrl:"https://culturalpthg.airitibooks.com"},
{name:"臺南市立圖書館",baseUrl:"https://tnml.airitibooks.com"}
];
const libraryList=document.getElementById("libraryList");
const allLibraryNames=[...Object.keys(ebookserviceLibCodeMap),...Object.keys(udnLibCodeMap),...ireadLibraries.map(item=>item.name)];
const uniqueLibraryNames=[...new Set(allLibraryNames)];
uniqueLibraryNames.forEach(name=>{
const hasLibrary=!!ebookserviceLibCodeMap[name]||!!udnLibCodeMap[name]||ireadLibraries.some(item=>item.name===name);
const div=document.createElement("div");
div.className="library-item";
div.innerHTML=`<div class="form-check"><input class="form-check-input library-check" type="checkbox" value="${escapeHtml(name)}" id="lib-${encodeURIComponent(name)}" ${hasLibrary?"checked":""}><label class="form-check-label" for="lib-${encodeURIComponent(name)}">${escapeHtml(name)}</label></div>`;
libraryList.appendChild(div);
});
updateLibraryCount();
function escapeHtml(value){
return String(value).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#039;");
}
function getSelectedLibraries(){
return [...document.querySelectorAll(".library-check:checked")].map(input=>input.value);
}
function getSelectedPlatforms(){
return [...document.querySelectorAll(".platform-check:checked")].map(input=>input.value);
}
function updateLibraryCount(){
document.getElementById("libraryCount").textContent=document.querySelectorAll(".library-check:checked").length;
}
document.getElementById("selectAllPlatforms").addEventListener("click",()=>document.querySelectorAll(".platform-check").forEach(input=>input.checked=true));
document.getElementById("clearAllPlatforms").addEventListener("click",()=>document.querySelectorAll(".platform-check").forEach(input=>input.checked=false));
document.getElementById("selectAllLibraries").addEventListener("click",()=>{
document.querySelectorAll(".library-check").forEach(input=>input.checked=true);
updateLibraryCount();
});
document.getElementById("clearAllLibraries").addEventListener("click",()=>{
document.querySelectorAll(".library-check").forEach(input=>input.checked=false);
updateLibraryCount();
});
document.addEventListener("change",event=>{
if(event.target.classList.contains("library-check"))updateLibraryCount();
});
async function searchPublic(searchBookName){
const url=`${PUBLIC_PROXY_BASE_URL}/api/nlpi/search?q=${encodeURIComponent(searchBookName)}`;
const res=await fetch(url);
if(!res.ok)throw new Error(`Public HTTP ${res.status}`);
const json=await res.json();
if(!Array.isArray(json?.record))return[];
return json.record.slice(0,10).map(item=>({
title:item.t,
link:`https://ebook.nlpi.edu.tw/bookdetail/${item.sid}`,
library:"國立公共資訊圖書館",
platform:"public"
}));
}
async function searchEbookservice(selectedLibraries,searchBookName){
const activeLibraries=selectedLibraries.map(name=>({name,code:ebookserviceLibCodeMap[name]})).filter(item=>!!item.code);
const requests=activeLibraries.map(async({name,code})=>{
try{
const proxyUrl=`${RENDER_PROXY_BASE_URL}/api/ebookservice/search?code=${encodeURIComponent(code)}&q=${encodeURIComponent(searchBookName)}`;
const res=await fetch(proxyUrl);
if(!res.ok)throw new Error(`HTTP ${res.status}`);
const json=await res.json();
if(!Array.isArray(json?.payload?.hits?.hit))return[];
return json.payload.hits.hit.map(book=>({
title:book.fields.title,
link:`https://www.ebookservice.tw/${code==="tpe"?"tp":code}/book/${book.fields.id}`,
library:name,
platform:"ebookservice"
}));
}catch(err){
console.warn(`ebookservice - ${name}`,err);
return[];
}
});
return (await Promise.all(requests)).flat();
}
async function searchUdn(selectedLibraries,searchBookName){
const activeLibraries=selectedLibraries.map(name=>({name,code:udnLibCodeMap[name]})).filter(item=>!!item.code);
const requests=activeLibraries.map(async({name,code})=>{
try{
const proxyUrl=`${RENDER_PROXY_BASE_URL}/api/udn/search?code=${encodeURIComponent(code)}&q=${encodeURIComponent(searchBookName)}`;
const res=await fetch(proxyUrl);
if(!res.ok)throw new Error(`HTTP ${res.status}`);
const data=await res.json();
if(data?.status!==200||!Array.isArray(data?.data?.products))return[];
return data.data.products.map(book=>({
title:book.name,
link:`https://reading.udn.com/udnlib/${code}/B/${book.iid}`,
library:name,
platform:"udn"
}));
}catch(err){
console.warn(`UDN - ${name}`,err);
return[];
}
});
return (await Promise.all(requests)).flat();
}
async function searchIread(searchBookName,selectedLibraries){
const activeLibraries=ireadLibraries.filter(item=>selectedLibraries.includes(item.name));
const requests=activeLibraries.map(async({name,baseUrl})=>{
try{
const proxyUrl=`${RENDER_PROXY_BASE_URL}/api/iread/search?keyword=${encodeURIComponent(searchBookName)}&baseUrl=${encodeURIComponent(baseUrl)}`;
const res=await fetch(proxyUrl);
if(!res.ok)throw new Error(`HTTP ${res.status}`);
const json=await res.json();
if(!Array.isArray(json))return[];
return json.map(({title,id})=>({
title:title,
link:`${baseUrl}/Detail/Detail?PublicationID=${id}&DetailSourceType=2`,
library:name,
platform:"iread"
}));
}catch(err){
console.warn(`iRead - ${name}`,err);
return[];
}
});
return (await Promise.all(requests)).flat();
}
const platformNames={
public:"國資圖",
ebookservice:"雲端書庫",
udn:"UDN",
iread:"iRead"
};
const platformOrder=["public","ebookservice","udn","iread"];
function normalizeTitle(title){
return String(title||"").trim().replace(/\s+/g,"").replace(/[　]/g,"").toLowerCase();
}
function mergeResults(results){
const map=new Map();
results.forEach(book=>{
const key=`${book.platform}|||${normalizeTitle(book.title)}`;
if(!map.has(key)){
map.set(key,{
platform:book.platform,
title:book.title,
libraries:[]
});
}
const group=map.get(key);
if(!group.libraries.some(item=>item.name===book.library)){
group.libraries.push({
name:book.library,
link:book.link
});
}
});
return [...map.values()];
}
async function searchAll(){
const searchBookName=document.getElementById("searchInput").value.trim();
if(!searchBookName){
showStatus("請先輸入書名。","warning");
document.getElementById("resultsArea").innerHTML="";
return;
}
const platforms=getSelectedPlatforms();
if(platforms.length===0){
showStatus("請至少選擇一個搜尋平台。","warning");
return;
}
const selectedLibraries=getSelectedLibraries();
document.getElementById("resultsArea").innerHTML="";
showStatus(`<div class="d-flex align-items-center gap-2"><div class="spinner-border spinner-border-sm" role="status"></div><span>正在搜尋「${escapeHtml(searchBookName)}」...</span></div>`,"info");
const tasks=[];
if(platforms.includes("public")){
tasks.push(searchPublic(searchBookName).then(results=>({platform:"public",results})).catch(error=>({platform:"public",results:[],error})));
}
if(platforms.includes("ebookservice")&&selectedLibraries.length>0){
tasks.push(searchEbookservice(selectedLibraries,searchBookName).then(results=>({platform:"ebookservice",results})).catch(error=>({platform:"ebookservice",results:[],error})));
}
if(platforms.includes("udn")&&selectedLibraries.length>0){
tasks.push(searchUdn(selectedLibraries,searchBookName).then(results=>({platform:"udn",results})).catch(error=>({platform:"udn",results:[],error})));
}
if(platforms.includes("iread")&&selectedLibraries.length>0){
tasks.push(searchIread(searchBookName,selectedLibraries).then(results=>({platform:"iread",results})).catch(error=>({platform:"iread",results:[],error})));
}
const responses=await Promise.all(tasks);
const allResults=responses.flatMap(item=>item.results);
const mergedResults=mergeResults(allResults);
renderResults(mergedResults,searchBookName);
const errors=responses.filter(item=>item.error);
if(errors.length>0){
showStatus(`搜尋完成，共找到 <strong>${mergedResults.length}</strong> 筆不同書名。部分平台可能因 Proxy、CORS 或 API 暫時無法連線。`,"warning");
}else{
showStatus(`搜尋完成：<strong>${mergedResults.length}</strong> 筆不同書名`,"success");
}
}
function renderResults(results,searchBookName){
const resultsArea=document.getElementById("resultsArea");
if(!results.length){
resultsArea.innerHTML=`<div class="card border-0 shadow-sm"><div class="card-body text-center py-5 text-muted"><div class="fs-1 mb-3">📚</div><h5>找不到「${escapeHtml(searchBookName)}」</h5><p class="mb-0">可以嘗試其他關鍵字、書名或取消部分圖書館篩選。</p></div></div>`;
return;
}
const grouped={};
results.forEach(result=>{
if(!grouped[result.platform])grouped[result.platform]=[];
grouped[result.platform].push(result);
});
let html="";
platformOrder.forEach(platform=>{
const platformResults=grouped[platform]||[];
if(!platformResults.length)return;
html+=`<div class="platform-section"><div class="d-flex justify-content-between align-items-center"><div class="platform-title">${platformNames[platform]}</div><span class="badge text-bg-light">${platformResults.length} 本</span></div>`;
platformResults.forEach(book=>{
html+=`<div class="card result-card shadow-sm"><div class="card-body"><div class="result-title mb-2">${escapeHtml(book.title||"未命名")}</div><div class="small text-muted mb-2">可借閱圖書館：</div><div>`;
book.libraries.forEach(library=>{
html+=`<a href="${escapeHtml(library.link)}" target="_blank" rel="noopener noreferrer" class="btn btn-sm btn-outline-primary library-link">${escapeHtml(library.name)}</a>`;
});
html+=`</div></div></div>`;
});
html+=`</div>`;
});
resultsArea.innerHTML=html;
}
function showStatus(message,type="info"){
document.getElementById("statusArea").innerHTML=`<div class="alert alert-${type} mb-0">${message}</div>`;
}
document.getElementById("searchButton").addEventListener("click",searchAll);
document.getElementById("searchInput").addEventListener("keydown",event=>{
if(event.key==="Enter")searchAll();
});
showStatus("輸入書名後按「搜尋」。","light");
</script>
</body>
</html>
