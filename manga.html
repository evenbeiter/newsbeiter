    body {
    background: #f5f5f5;
    }

    /* ===== Sidebar ===== */
    .sidebar {
    width: 260px;
    min-height: calc(100vh - 56px);
    transition: all 0.25s ease;
    overflow-y: auto;
    }

    .sidebar.collapsed {
    width: 0;
    overflow: hidden;
    }

    /* ===== Main Layout ===== */
    .view {
    max-width: 900px;
    margin: 0 auto;
    }

    /* ===== Manga List ===== */
    #mangaList .list-group-item {
    cursor: pointer;
    }

    #mangaList .list-group-item:hover {
    background: #e9ecef;
    }

    /* ===== Chapter Buttons ===== */
    .chapter-group {
    margin-bottom: 20px;
    }

    .chapter-group-title {
    font-weight: 600;
    margin-bottom: 8px;
    }

    /* chapter grid */
    .chapter-grid {
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    gap: 6px;
    }

    .chapter-btn {
    font-size: 12px;
    padding: 6px 0;
    }

    /* ===== Reader ===== */
    #imageContainer img {
    width: 100%;
    height: auto;
    display: block;
    border-radius: 4px;
    }

    /* ===== Controls ===== */
    #readerView h5 {
    text-align: center;
    margin-bottom: 10px;
    }

    /* ===== Loading ===== */
    #loading {
    margin-top: 20px;
    }

    /* ===== Mobile ===== */
    @media (max-width: 768px) {
    .sidebar {
        position: fixed;
        z-index: 1000;
        background: white;
        height: 100%;
        left: 0;
        top: 56px;
    }

    .chapter-grid {
        grid-template-columns: repeat(4, 1fr);
    }
    }

    /* ===== Dark Mode (basic) ===== */
    body.dark {
    background: #121212;
    color: #eaeaea;
    }

    body.dark .sidebar {
    background: #1e1e1e;
    border-color: #333;
    }

    body.dark .list-group-item {
    background: #1e1e1e;
    color: #ddd;
    }

    body.dark .list-group-item:hover {
    background: #2a2a2a;
    }

    body.dark .btn {
    color: #eaeaea;
    }

    body.dark .modal-content {
    background: #1e1e1e;
    color: #eaeaea;
    }
  </style>
</head>

function range(start, end) {
  const arr = [];
  for (let i = start; i <= end; i++) {
    arr.push(i);
  }
  return arr;
}

// 倒序 range（漫畫常用）

  const arr = [];
  for (let i = end; i >= start; i--) {

// 百位分組：0-99 / 100-199
function groupByHundreds(max) {
  const groups = [];

  for (let start = 0; start <= max; start += 100) {
    const end = Math.min(start + 99, max);
    groups.push({ start, end });
  }

  return groups;
}

// 十位分組：0-9 / 10-19
function groupByTens(start, end) {
  const groups = [];

  for (let i = start; i <= end; i += 10) {
    const gEnd = Math.min(i + 9, end);
    groups.push({ start: i, end: gEnd });
  }

  return groups;
}

const STORAGE_KEY = "manga_reader_state";

// ===== Get All =====
function getAllData() {
  const raw = localStorage.getItem(STORAGE_KEY);
  if (!raw) return {};
  try {
    return JSON.parse(raw);
  } catch (e) {
    return {};
  }
}

// ===== Save All =====
function saveAllData(data) {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
}

// ===== Save Last Read =====
function saveLastRead(mangaId, chapter) {
  const data = getAllData();

  data[mangaId] = {
    chapter,
    timestamp: Date.now()
  };

  saveAllData(data);
}

// ===== Get Last Read =====
function getLastRead(mangaId) {
  const data = getAllData();
  return data[mangaId] || null;
}

// ===== Get Recently Read List (optional future use) =====
function getRecentList(limit = 10) {
  const data = getAllData();

  return Object.entries(data)
    .map(([mangaId, value]) => ({
      mangaId,
      ...value
    }))
    .sort((a, b) => b.timestamp - a.timestamp)
    .slice(0, limit);
}

// ===== Clear One Manga =====
function clearLastRead(mangaId) {
  const data = getAllData();
  delete data[mangaId];
  saveAllData(data);
}

// ===== Clear All =====
function clearAll() {
  localStorage.removeItem(STORAGE_KEY);

  mangaListEl.innerHTML = "";

// ===== Chapter Groups =====

function renderChapterGroups(list, isAsc = false) {
  chapterGroupsEl.innerHTML = "";
  modalChapterGroupsEl.innerHTML = "";

  // 先確保順序
  const orderedList = isAsc ? [...list] : [...list].reverse();

  // chunk 成 100 一組
  const groups = [];
  for (let i = 0; i < orderedList.length; i += 100) {
    groups.push(orderedList.slice(i, i + 100));
  }

  groups.forEach((group, gIndex) => {
    const startLabel = group[0];
    const endLabel = group[group.length - 1];

    const groupDiv = document.createElement("div");
    groupDiv.className = "chapter-group";

    const header = document.createElement("div");
    header.className = "chapter-group-title";
    header.innerText = `${startLabel} - ${endLabel}`;

    const grid = document.createElement("div");
    grid.className = "chapter-grid";
    grid.style.display = "none";

    header.onclick = () => {
      grid.style.display = grid.style.display === "none" ? "grid" : "none";
    };

    // ⚠️ 用 list value 當 chapter id（不是數字）
    group.forEach(id => {
      grid.appendChild(createChapterBtn(id));
    });

    groupDiv.appendChild(header);
    groupDiv.appendChild(grid);

    chapterGroupsEl.appendChild(groupDiv);

    // modal version（直接展開）
    const modalGroup = groupDiv.cloneNode(true);
    modalGroup.querySelector(".chapter-grid").style.display = "grid";
    modalChapterGroupsEl.appendChild(modalGroup);
  });
}

// ===== Chapter Button =====
function createChapterBtn(i) {
  const btn = document.createElement("button");
  btn.className = "btn btn-outline-secondary chapter-btn";
  btn.innerText = i;

  btn.onclick = () => loadChapter(i);

  return btn;
}

// ===== Load Chapter =====
async function loadChapter(chapter) {
  if (!currentManga) return;

  currentIndex = chapter;

  showReaderView();

  readingTitle.innerText = `${currentManga.name} - Chapter ${chapter}`;

  saveLastRead(currentManga.url, chapter);

  showLoading(true);

  imageContainer.innerHTML = "";

  // API call (placeholder)
  const images = await apiGetChapterImages(currentManga.url, chapter);

  showLoading(false);

  renderImages(images);
}

// ===== Render Images =====
function renderImages(images) {
  imageContainer.innerHTML = "";

  images.forEach(src => {
    const img = document.createElement("img");
    img.src = src;
    img.loading = "lazy";
    imageContainer.appendChild(img);
  });
}

// ===== Views =====
function showReaderView() {
  chapterView.classList.add("d-none");
  readerView.classList.remove("d-none");
}

function showChapterView() {
  chapterView.classList.remove("d-none");
  readerView.classList.add("d-none");
}

// ===== Loading =====
function showLoading(show) {
  loadingEl.classList.toggle("d-none", !show);
}

// ===== Last Read =====
function updateLastRead() {
  const data = getLastRead(currentManga.url);

  if (data) {
    lastReadEl.innerText = `Chapter ${data.chapter}`;
  } else {
    lastReadEl.innerText = "無紀錄";
  }
}
