<script>

// ===============================
// ARRAY HELPERS
// ===============================

// 產生 range（例如章節列表）
function range(start, end) {
  const arr = [];
  for (let i = start; i <= end; i++) {
    arr.push(i);
  }
  return arr;
}

// 倒序 range（漫畫常用）
function rangeDesc(start, end) {
  const arr = [];
  for (let i = end; i >= start; i--) {
    arr.push(i);
  }
  return arr;
}

  isAsc = !isAsc;
  renderChapterGroups(latestChapter, isAsc);

// 百位分組：0-99 / 100-199
function groupByHundreds(max) {
  const groups = [];

  for (let start = 0; start <= max; start += 100) {
    const end = Math.min(start + 99, max);
    groups.push({ start, end });
  }

  return groups;
}

// 十位分組：0-9 / 10-19
function groupByTens(start, end) {
  const groups = [];

  for (let i = start; i <= end; i += 10) {
    const gEnd = Math.min(i + 9, end);
    groups.push({ start: i, end: gEnd });
  }

  return groups;
}

// ===============================
// FORMAT HELPERS
// ===============================

// 補零（未來 API 或顯示可能用）
function pad(num, size = 3) {
  let s = String(num);
  while (s.length < size) s = "0" + s;
  return s;
}

//storage
const STORAGE_KEY = "manga_reader_state";

// ===== Get All =====
function getAllData() {
  const raw = localStorage.getItem(STORAGE_KEY);
  if (!raw) return {};
  try {
    return JSON.parse(raw);
  } catch (e) {
    return {};
  }
}

// ===== Save All =====
function saveAllData(data) {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
}

// ===== Save Last Read =====
// ===== Save Last Read =====
function saveLastRead(
    mangaId,
    chapter,
    imageIndex = 0,
    scrollY = 0,
    mode
) {
    const data = getAllData();

    data[mangaId] = {
        chapter,
        imageIndex,
        scrollY,
        mode,
        timestamp: Date.now()
    };

    saveAllData(data);
}

// ===== Get Last Read =====
function getLastRead(mangaId) {
  const data = getAllData();
  return data[mangaId] || null;
}

// ===== Get Recently Read List (optional future use) =====
function getRecentList(limit = 10) {
  const data = getAllData();

  return Object.entries(data)
    .map(([mangaId, value]) => ({
      mangaId,
      ...value
    }))
    .sort((a, b) => b.timestamp - a.timestamp)
    .slice(0, limit);
}

// ===== Clear One Manga =====
function clearLastRead(mangaId) {
  const data = getAllData();
  delete data[mangaId];
  saveAllData(data);
}

// ===== Clear All =====
function clearAll() {
  localStorage.removeItem(STORAGE_KEY);
}

async function apiGetChapters(mangaUrl, site) {
  const url = `${preStr}${mangaUrl}`;
  const html = await fetch(url).then(r => r.text());
  const parser=new DOMParser();const doc=parser.parseFromString(html, "text/html");

  const list = window[`${site}GetList`](doc);
  return list
}

function acgnGetList(doc){

    .map(a => ({
      url: a.href.replace('https://evenbeiter.github.io/newsbeiter/','https://comic.acgn.cc/'),
      text: a.textContent.trim()
    }))
    .reverse();
  return list;
}

function spyxGetList(doc){
  const list = [...doc.querySelectorAll('#Chapters_List li a')]
    .map(a => ({
      url: a.href,
      text: a.textContent.trim()
    }))
    .reverse();
  return list;
}

function katanaGetList(doc){
  const tbody = doc.querySelector('.chapters table tbody');
  list = Array.from(tbody.querySelectorAll("tr"))
    .map(tr => {
      const a = tr.querySelector("a");
      if (!a) return null;
      const href = a.href;
      const idx = href.lastIndexOf("c");
      if (idx === -1) return null;
      return {
        url: href,
        text: href.slice(idx + 1)
      };
    })
    .filter(Boolean)
    .reverse();
  return list;
}

//app
const READER_MODE = {
    PAGE: "scroll",
    SCROLL: "scroll"
};
let readerMode = READER_MODE.PAGE;

const mangas = [
  { name: "ORV", url: "https://mangakatana.com/manga/omniscient-readers-viewpoint.24674", site: "katana", defaultMode: READER_MODE.SCROLL },
  { name: "Spy x Family", url: "https://xspy.spyxmanga.com/", site: "spyx", defaultMode: READER_MODE.PAGE },
  { name: "One Piece", url: "https://mangakatana.com/manga/one-piece.49", site: "katana", defaultMode: READER_MODE.PAGE },
  { name: "Haikyu!!", url: "https://mangakatana.com/manga/haikyu.19856", site: "katana", defaultMode: READER_MODE.PAGE },
  { name: "Daughter of the Nile", url: "https://mangakatana.com/manga/ouke-no-monshou.3507", site: "katana", defaultMode: READER_MODE.PAGE },
  { name: "尼羅河女兒", url: "https://comic.acgn.cc/manhua-nlhne.htm", site: "acgn", defaultMode: READER_MODE.PAGE }
];

// ===== State =====
let currentManga = null;
let currentChapter = null;
// let latestChapter = 0;

let chapterList = [];   // 你的 list
let currentIndex = 0;   // 目前位置

let currentImageIndex = 0;
let currentImages = [];




// ===== DOM =====
const sidebar = document.getElementById("sidebar");
const mangaListEl = document.getElementById("mangaList");

const chapterView = document.getElementById("chapterView");
const readerView = document.getElementById("readerView");

const chapterGroupsEl = document.getElementById("chapterGroups");
const modalChapterGroupsEl = document.getElementById("modalChapterGroups");

const imageContainer = document.getElementById("imageContainer");

const mangaTitle = document.getElementById("mangaTitle");
const readingTitle = document.getElementById("readingTitle");
const lastReadEl = document.getElementById("lastRead");

const loadingEl = document.getElementById("loading");

// ===== Init =====
init();

function init() {
  renderMangaList();
  bindEvents();
}

// ===== Events =====

function bindEvents() {

  document.getElementById("toggleSidebar").onclick = () => {
    sidebar.classList.toggle("collapsed");
  };

  document.getElementById("backToChapters").onclick = () => {
    showChapterView();
  };

  document.getElementById("prevChapter").onclick = () => {
    if (currentIndex > 0) {
      currentIndex--;
      loadChapter(chapterList[currentIndex]);
      // loadChapter(chapterList[currentIndex].url);
    }
  };

  document.getElementById("nextChapter").onclick = () => {
    if (currentIndex < chapterList.length - 1) {
      currentIndex++;
      loadChapter(chapterList[currentIndex]);
      // loadChapter(chapterList[currentIndex].url);
    }
  };
}


// ===== Manga List =====
function renderMangaList() {
  mangaListEl.innerHTML = "";

  mangas.forEach(m => {
    const div = document.createElement("div");
    div.className = "list-group-item";
    div.innerText = m.name;

    div.onclick = async () => {
      await selectManga(m);
    };

    mangaListEl.appendChild(div);
  });
}

// ===== Select Manga =====
async function selectManga(manga) {
  sidebar.classList.toggle("collapsed");
  chapterGroupsEl.innerHTML = "";
  modalChapterGroupsEl.innerHTML = "";
  currentManga = manga;
  mangaTitle.innerText = manga.name;
  showChapterView();

  // fetch latest chapter (API layer placeholder)
  chapterList = await apiGetChapters(manga.url, manga.site);
  renderChapterGroups(chapterList, manga.site);
  updateLastRead();
}

// ===== Chapter Groups =====

function renderChapterGroups(list, site, isAsc = true) {
  chapterGroupsEl.innerHTML = "";
  modalChapterGroupsEl.innerHTML = "";

  // 先確保順序
  const orderedList = isAsc ? [...list] : [...list].reverse();

  // chunk 成 100 一組
  const groups = [];
  for (let i = 0; i < orderedList.length; i += 100) {
    groups.push(orderedList.slice(i, i + 100));
  }

  groups.forEach(group => {
    const startLabel = group[0].text;
    const endLabel = group[group.length - 1].text;

    const groupDiv = document.createElement("div");
    groupDiv.className = "chapter-group";

    const header = document.createElement("div");
    header.className = "chapter-group-title";
    header.innerText = `${startLabel} - ${endLabel}`;

    const grid = document.createElement("div");
    grid.className = "chapter-grid";
    grid.style.display = "none";

    header.onclick = () => {
      grid.style.display = grid.style.display === "none" ? "grid" : "none";
    };

    // item = { url, text }
    group.forEach(item => {
      grid.appendChild(createChapterBtn(item));
    });

    groupDiv.appendChild(header);
    groupDiv.appendChild(grid);

    chapterGroupsEl.appendChild(groupDiv);

    // modal version（直接展開）
    const modalGroup = groupDiv.cloneNode(true);
    modalGroup.querySelector(".chapter-grid").style.display = "grid";
    modalChapterGroupsEl.appendChild(modalGroup);
  });
}



// ===== Chapter Button =====

function createChapterBtn(chapter) {
  const btn = document.createElement("button");
  btn.className = "btn btn-outline-secondary chapter-btn";
  btn.innerText = chapter.text;

  btn.onclick = () => loadChapter(chapter);

  return btn;
}



// ===== Load Chapter =====

async function loadChapter(chapter) {
  currentChapter = chapter;
  if (!currentManga) return;

  // chapter 現在是 object
  currentIndex = chapterList.findIndex(c => c.url === chapter.url);
  showReaderView();
  readingTitle.innerText = `${currentManga.name} - Chapter ${chapter.text}`;
  if (currentManga.defaultMode==='scroll') {
    saveLastRead(currentManga.url, chapter, currentImageIndex, window.scrollY, currentManga.defaultMode);
  } else {
    saveLastRead(currentManga.url, chapter, currentImageIndex, 0, currentManga.defaultMode);
  }
  showLoading(true);
  imageContainer.innerHTML = "";

  // let c=chapter.text;
  // if (currentManga.site==="zh"){c=chapter.url;}
  
  // API call
  const images = await apiGetChapterImages(
    chapter.url,
    currentManga.site
  );

  showLoading(false);

  const last=getLastRead(currentManga.url);
  if(last){
    readerMode=last.mode;
    currentImageIndex=last.imageIndex;
  } else {
    currentImageIndex=0;
  }

  renderImages(images);

}



// ===== Render Images =====

function renderImages(images) {
  currentImages=images;
  if (readerMode === "page") {
    renderPageMode();
  } else {
    renderScrollMode(images);
  }
}

function renderScrollMode(images) {
  imageContainer.className="";
  imageContainer.innerHTML = "";

  images.forEach(src => {
    const img = document.createElement("img");
    img.src = src;
    img.loading = "lazy";
    imageContainer.appendChild(img);
  });

  saveLastRead(
    currentManga.url,
    currentChapter,
    currentImageIndex,
    window.scrollY,
    "scroll"
  );
}

function renderPageMode(){
  imageContainer.className="page-mode";
  imageContainer.innerHTML="";
  const img=document.createElement("img");
  img.src=currentImages[currentImageIndex];
  imageContainer.appendChild(img);

  img.onclick=e=>{
    const x=e.offsetX;
    if(x<img.clientWidth*0.3){
      prevImage();
    }else if(x>img.clientWidth*0.7){
      nextImage();
    }
  };

  preloadAroundCurrent(3);
  // if(currentImageIndex+1<currentImages.length){
  //   const preload=new Image();
  //   preload.src=currentImages[currentImageIndex+1];
  // };

  saveLastRead(
    currentManga.url,
    currentChapter,
    currentImageIndex,
    0,
    "page"
  );
}

const imageCache = new Set();

function preloadAroundCurrent(count = 3) {
  for (let i = -count; i <= count; i++) {
    if (i === 0) continue;
    const index = currentImageIndex + i;
    if(index >= 0 && index < currentImages.length){
      const src = currentImages[index];
      if(!imageCache.has(src)){
        const img = new Image();
        img.src = src;
        imageCache.add(src);
      }
    }
  }
}


// function preloadNextImages(count = 3) {
//   for (let i = 1; i <= count; i++) {
//     const index = currentImageIndex + i;

//     if (index < currentImages.length) {
//       const img = new Image();
//       img.src = currentImages[index];
//     }
//   }
// }

function prevImage() {
    // 還有上一張圖片
    if (currentImageIndex > 0) {
        currentImageIndex--;
        renderPageMode();
        preloadAroundCurrent(3);
        saveLastRead(
            currentManga.url,
            currentChapter,
            currentImageIndex,
            0,
            "page"
        );

        return;
    }

    // 已經是第一張，切到上一話
    if (currentIndex > 0) {
        currentIndex--;
        loadChapter(chapterList[currentIndex]);
    }

}

function nextImage() {
    // 還有下一張圖片
    if (currentImageIndex < currentImages.length - 1) {
        currentImageIndex++;
        renderPageMode();
        preloadAroundCurrent(3);
        saveLastRead(
            currentManga.url,
            currentChapter,
            currentImageIndex,
            0,
            "page"
        );

        return;
    }

    // 最後一張，自動下一話
    if (currentIndex < chapterList.length - 1) {
        currentIndex++;
        loadChapter(chapterList[currentIndex]);
    }

}

// ===== Views =====
function showReaderView() {
  chapterView.classList.add("d-none");
  readerView.classList.remove("d-none");
}

function showChapterView() {
  chapterView.classList.remove("d-none");
  readerView.classList.add("d-none");
}

// ===== Loading =====
function showLoading(show) {
  loadingEl.classList.toggle("d-none", !show);
}

// ===== Last Read =====
function updateLastRead() {
  const data = getLastRead(currentManga.url);

  if (data) {
    lastReadEl.innerText = `Chapter ${data.chapter.text}`;
  } else {
    lastReadEl.innerText = "無紀錄";
  }
}

// ===== Helpers =====
function toast(msg) {
  const el = document.getElementById("toast");
  document.getElementById("toastMsg").innerText = msg;

  const t = new bootstrap.Toast(el);
  t.show();
}


</script>
