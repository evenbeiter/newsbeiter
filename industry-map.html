<!doctype html>
<html lang="zh-Hant" data-bs-theme="light">

<head>
    <meta charset="utf-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>產業地圖｜Industry Map</title>

    <!-- Bootstrap 5.3.8 -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.css"
        rel="stylesheet">


    <style>

        :root {
            --map-sidebar-width: 310px;
            --map-right-width: 390px;

            --node-border: #dee2e6;
            --node-bg: #ffffff;
            --node-hover: #f1f5f9;
            --node-active: #e8f3ff;
        }


        body {
            background: var(--bs-body-bg);
            overflow: hidden;
        }


        /* =====================================================
           APP
        ===================================================== */

        #app {
            height: 100vh;
            display: flex;
            flex-direction: column;
        }


        .app-navbar {
            flex: 0 0 auto;
            z-index: 1000;
        }


        .app-body {
            min-height: 0;
            flex: 1;
            display: flex;
        }


        /* =====================================================
           LEFT SIDEBAR
        ===================================================== */

        #sidebar {
            width: var(--map-sidebar-width);
            min-width: var(--map-sidebar-width);

            border-right:
                1px solid var(--bs-border-color);

            background:
                var(--bs-body-bg);

            display: flex;
            flex-direction: column;

            overflow: hidden;

            z-index: 100;
        }


        .sidebar-header {
            padding: 1rem;

            border-bottom:
                1px solid var(--bs-border-color);
        }


        .industry-groups {
            flex: 1;
            overflow-y: auto;
            padding: .5rem;
        }


        .group-header {
            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: .65rem .75rem;
            margin-top: .25rem;

            font-weight: 600;

            cursor: pointer;

            border-radius: .5rem;
        }


        .group-header:hover {
            background:
                var(--bs-tertiary-bg);
        }


        .industry-list {
            padding-left: .5rem;
        }


        .industry-item {
            width: 100%;

            text-align: left;

            border: 0;

            background: transparent;

            padding: .55rem .75rem;

            border-radius: .45rem;

            color:
                var(--bs-body-color);

            display: flex;
            align-items: center;

            gap: .5rem;

            cursor: pointer;
        }


        .industry-item:hover {
            background:
                var(--bs-tertiary-bg);
        }


        .industry-item.active {
            background:
                var(--node-active);

            color:
                var(--bs-primary);

            font-weight: 600;
        }


        .industry-count {
            margin-left: auto;
            font-size: .72rem;
        }


        /* =====================================================
           MAIN MAP
        ===================================================== */

        #map-area {
            min-width: 0;

            flex: 1;

            display: flex;
            flex-direction: column;

            overflow: hidden;
        }


        .map-toolbar {
            flex: 0 0 auto;

            border-bottom:
                1px solid var(--bs-border-color);

            padding: .65rem 1rem;
        }


        #map-scroll {
            flex: 1;

            overflow: auto;

            padding: 2rem;
        }


        /* =====================================================
           INDUSTRY HERO
        ===================================================== */

        .industry-title {
            font-weight: 700;

            letter-spacing: -.02em;
        }


        .industry-description {
            max-width: 1000px;

            line-height: 1.8;
        }


        .tag {
            display: inline-block;

            padding: .3rem .6rem;

            border-radius: 999px;

            background:
                var(--bs-tertiary-bg);

            font-size: .8rem;

            margin-right: .25rem;
            margin-bottom: .25rem;
        }


        /* =====================================================
           RELATION
        ===================================================== */

        .relation-section {
            margin-top: 2rem;
        }


        .relation-title {
            display: flex;
            align-items: center;

            gap: .5rem;

            margin-bottom: 1rem;

            font-weight: 700;
        }


        .relation-grid {
            display: grid;

            grid-template-columns:
                repeat(3, minmax(220px, 1fr));

            gap: 1.5rem;

            align-items: start;
        }


        .relation-column {
            min-width: 0;
        }


        .relation-column-title {
            font-size: .9rem;

            font-weight: 700;

            margin-bottom: .75rem;

            display: flex;
            align-items: center;

            gap: .4rem;
        }


        .relation-cards {
            display: flex;
            flex-direction: column;

            gap: .65rem;
        }


        .relation-card {
            border:
                1px solid var(--node-border);

            background:
                var(--node-bg);

            border-radius: .75rem;

            padding: .8rem;

            cursor: pointer;

            transition:
                transform .12s ease,
                box-shadow .12s ease,
                background .12s ease;
        }


        .relation-card:hover {
            transform:
                translateY(-2px);

            box-shadow:
                0 .3rem 1rem
                rgba(0,0,0,.08);

            background:
                var(--node-hover);
        }


        .relation-card-name {
            font-weight: 600;

            line-height: 1.4;
        }


        .relation-card-id {
            font-size: .7rem;

            opacity: .6;

            margin-top: .2rem;
        }


        .relation-empty {
            border:
                1px dashed
                var(--bs-border-color);

            border-radius: .75rem;

            padding: 1rem;

            text-align: center;

            opacity: .6;

            font-size: .85rem;
        }


        /* =====================================================
           DETAIL SECTION
        ===================================================== */

        #industry-detail-below-map {
            margin-top: 1rem;
        }


        .detail-block {
            margin-top: 2rem;
        }


        .detail-block-title {
            font-weight: 700;

            margin-bottom: 1rem;
        }


        /* =====================================================
           SUPPLY CHAIN
        ===================================================== */

        .supply-chain-wrapper {
            overflow-x: auto;

            padding-bottom: .75rem;
        }


        .supply-chain {
            display: flex;

            gap: 1.5rem;

            align-items: stretch;

            min-width: max-content;
        }


        .supply-segment {
            width: 250px;

            border:
                1px solid
                var(--bs-border-color);

            border-radius: .75rem;

            padding: .9rem;

            background:
                var(--bs-tertiary-bg);
        }


        .supply-segment-title {
            font-weight: 700;

            margin-bottom: .25rem;
        }


        .supply-segment-subtitle {
            font-size: .78rem;

            opacity: .7;

            margin-bottom: .75rem;
        }


        .supply-child {
            background:
                var(--bs-body-bg);

            border:
                1px solid
                var(--bs-border-color);

            border-radius: .6rem;

            padding: .65rem;

            margin-top: .5rem;

            cursor: pointer;
        }


        .supply-child:hover {
            border-color:
                var(--bs-primary);
        }


        .supply-child-name {
            font-weight: 600;

            font-size: .85rem;
        }


        .supply-child-subtitle {
            font-size: .72rem;

            opacity: .7;

            margin-top: .2rem;
        }


        /* =====================================================
           METRICS
        ===================================================== */

        .metric-card {
            height: 100%;

            border:
                1px solid
                var(--bs-border-color);

            border-radius: .75rem;

            padding: 1rem;

            background:
                var(--bs-tertiary-bg);
        }


        .metric-value {
            font-size: 1.15rem;

            font-weight: 700;
        }


        .metric-label {
            font-size: .78rem;

            opacity: .65;

            margin-bottom: .2rem;
        }


        /* =====================================================
           STOCK
        ===================================================== */

        .stock-card {
            border:
                1px solid
                var(--bs-border-color);

            border-radius: .65rem;

            padding: .75rem;

            margin-bottom: .6rem;

            cursor: pointer;

            height: 100%;
        }


        .stock-card:hover {
            background:
                var(--bs-tertiary-bg);
        }


        .stock-code {
            font-weight: 700;
        }


        /* =====================================================
           RIGHT PANEL
        ===================================================== */

        #detail-panel {
            width:
                var(--map-right-width);

            min-width:
                var(--map-right-width);

            border-left:
                1px solid
                var(--bs-border-color);

            background:
                var(--bs-body-bg);

            display: flex;
            flex-direction: column;

            overflow: hidden;
        }


        .detail-header {
            padding: 1rem;

            border-bottom:
                1px solid
                var(--bs-border-color);

            display: flex;
            align-items: center;

            justify-content: space-between;
        }


        #detail-content {
            flex: 1;

            overflow-y: auto;

            padding: 1rem;
        }


        /* =====================================================
           EMPTY
        ===================================================== */

        .empty-state {
            min-height: 60vh;

            display: flex;

            align-items: center;

            justify-content: center;

            text-align: center;

            opacity: .65;
        }


        .empty-state-icon {
            font-size: 4rem;

            margin-bottom: 1rem;
        }


        /* =====================================================
           MOBILE
        ===================================================== */

        @media (max-width: 991.98px) {

            body {
                overflow: auto;
            }


            #app {
                min-height: 100vh;

                height: auto;
            }


            .app-body {
                display: block;
            }


            #sidebar {
                width: 100%;

                min-width: 0;

                max-height: 38vh;

                border-right: 0;

                border-bottom:
                    1px solid
                    var(--bs-border-color);
            }


            #map-area {
                min-height: 60vh;
            }


            #detail-panel {
                width: 100%;

                min-width: 0;

                border-left: 0;

                border-top:
                    1px solid
                    var(--bs-border-color);

                max-height: 55vh;
            }


            .relation-grid {
                grid-template-columns: 1fr;
            }


            #map-scroll {
                padding: 1rem;
            }

        }


        @media (max-width: 575.98px) {

            .supply-chain {
                gap: .75rem;
            }


            .supply-segment {
                width: 220px;
            }

        }

    </style>

</head>

        <div class="container-fluid">

<!-- =========================================================
     BOOTSTRAP
========================================================= -->

<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js">
</script>



<script>

/* =========================================================
   CONFIG
========================================================= */

const preStr = "https://newsbeiter.onrender.com/api/fetch?url=";

const CONFIG = {

    files: {

        relations:
            "imsrc/industry-relations.json",

        stockIndustries:
            "imsrc/stock-industries.json",

        industries:
            "imsrc/industries.json"

    },

    /*
     * 單一產業詳細資料
     *
     * 例如：
     *
     * data/ess-storage.json
     *
     */

    detailPath:
        "https://aistockmap.com/live/topics/"

};



/* =========================================================
   STATE
========================================================= */

const state = {

    relations: {},

    stockIndustries: {},

    industries: {},

    industriesArray: [],

    /*
     * 目前點選產業的詳細 JSON
     */
    currentIndustryDetail: null,

    selectedIndustry: null,

    selectedStock: null,

    relationFilter: "all",

    loaded: false

};



/* =========================================================
   DOM HELPERS
========================================================= */

const $ =
    selector =>
        document.querySelector(selector);


const $$ =
    selector =>
        [...document.querySelectorAll(selector)];



/* =========================================================
   INIT
========================================================= */

document.addEventListener(
    "DOMContentLoaded",
    init
);


async function init() {

    bindEvents();

    await loadData();

}



/* =========================================================
   EVENTS
========================================================= */

function bindEvents() {


    $("#industrySearch")
        .addEventListener(
            "input",
            handleSearch
        );


    $("#themeBtn")
        .addEventListener(
            "click",
            toggleTheme
        );


    $("#reloadBtn")
        .addEventListener(
            "click",
            loadData
        );


    $("#closeDetailBtn")
        .addEventListener(
            "click",
            () => {

                $("#detail-content").innerHTML = `

                    <div
                        class="text-center
                               text-body-secondary
                               p-4">

                        選擇產業或個股查看詳細資訊

                    </div>

                `;

            }
        );


    $("#showAllBtn")
        .addEventListener(
            "click",
            () => {

                state.relationFilter =
                    "all";

                renderMap();

            }
        );


    $("#showUpstreamBtn")
        .addEventListener(
            "click",
            () => {

                state.relationFilter =
                    "upstream";

                renderMap();

            }
        );


    $("#showDownstreamBtn")
        .addEventListener(
            "click",
            () => {

                state.relationFilter =
                    "downstream";

                renderMap();

            }
        );


    $("#showPeersBtn")
        .addEventListener(
            "click",
            () => {

                state.relationFilter =
                    "peers";

                renderMap();

            }
        );

}



/* =========================================================
   LOAD BASIC JSON
========================================================= */

async function loadData() {

    try {

        showLoading();


        const [

            relations,

            stockIndustries,

            industries

        ] = await Promise.all([

            fetchJSON(
                CONFIG.files.relations
            ),

            fetchJSON(
                CONFIG.files.stockIndustries
            ),

            fetchJSON(
                CONFIG.files.industries
            )

        ]);


        state.relations =
            normalizeObject(
                relations
            );


        state.stockIndustries =
            normalizeObject(
                stockIndustries
            );


        state.industriesArray =
            normalizeIndustries(
                industries
            );


        state.industries = {};


        state.industriesArray
            .forEach(industry => {

                state.industries[
                    industry.id
                ] = industry;

            });


        state.loaded = true;


        /*
         * 重新產生左側產業清單
         */

        renderIndustryGroups();


        /*
         * 如果目前有選取產業，
         * 重新顯示
         */

        if (
            state.selectedIndustry
        ) {

            await selectIndustry(
                state.selectedIndustry
            );

        } else {

            showEmptyState();

        }


    } catch (error) {

        console.error(error);

        showLoadError(error);

    }

}



/* =========================================================
   FETCH JSON
========================================================= */

async function fetchJSON(url) {

    const response =
        await fetch(
            url +
            "?_=" +
            Date.now()
        );


    if (!response.ok) {

        throw new Error(
            `${url} HTTP ${response.status}`
        );

    }


    return await response.json();

}



/* =========================================================
   FETCH SINGLE INDUSTRY DETAIL
========================================================= */

async function fetchIndustryDetail(
    industryId
) {

    const url =
        CONFIG.detailPath +
        encodeURIComponent(
            industryId
        ) +
        ".json";


    return await fetchJSON(
        url
    );

}



/* =========================================================
   NORMALIZE
========================================================= */

function normalizeObject(
    value
) {

    if (
        value &&
        typeof value === "object" &&
        !Array.isArray(value)
    ) {

        return value;

    }


    return {};

}



function normalizeIndustries(
    data
) {

    /*
     * 支援：
     *
     * [
     *   {...},
     *   {...}
     * ]
     *
     * 或：
     *
     * {
     *   "ess-storage": {...}
     * }
     */


    if (
        Array.isArray(data)
    ) {

        return data.filter(
            x =>
                x &&
                x.id
        );

    }


    if (
        data &&
        typeof data === "object"
    ) {

        return Object.entries(
            data
        )
        .map(
            ([id, value]) => {

                if (
                    typeof value ===
                    "string"
                ) {

                    return {

                        id,

                        name:
                            value,

                        shortname:
                            value,

                        group:
                            "其他"

                    };

                }


                return {

                    id,

                    ...value

                };

            }
        );

    }


    return [];

}



/* =========================================================
   GROUP
========================================================= */

function getGroup(
    industry
) {

    return (

        industry?.group ||

        industry?.category ||

        industry?.parent ||

        "其他"

    );

}



/* =========================================================
   COUNT STOCKS
========================================================= */

function countStocks(
    industryId
) {

    return Object.values(
        state.stockIndustries
    )
    .filter(
        ids =>
            Array.isArray(ids) &&
            ids.includes(
                industryId
            )
    )
    .length;

}



/* =========================================================
   SIDEBAR
========================================================= */

function renderIndustryGroups(
    filter = ""
) {

    const container =
        $("#industryGroups");


    const keyword =
        filter
            .trim()
            .toLowerCase();


    const filtered =
        state.industriesArray
        .filter(
            industry => {

                if (!keyword)
                    return true;


                return [

                    industry.id,

                    industry.name,

                    industry.shortname,

                    industry.description,

                    getGroup(industry)

                ]
                .filter(Boolean)
                .join(" ")
                .toLowerCase()
                .includes(
                    keyword
                );

            }
        );


    const groups = {};


    filtered.forEach(
        industry => {

            const group =
                getGroup(
                    industry
                );


            if (
                !groups[group]
            ) {

                groups[group] = [];

            }


            groups[group].push(
                industry
            );

        }
    );


    const groupNames =
        Object.keys(
            groups
        ).sort();


    if (
        !groupNames.length
    ) {

        container.innerHTML = `

            <div
                class="text-center
                       text-body-secondary
                       p-4">

                找不到符合條件的產業

            </div>

        `;

        return;

    }


    container.innerHTML =
        groupNames
        .map(
            (group, index) => {

                const industries =
                    groups[group];


                const collapseId =
                    "group-" +
                    index;


                return `

                    <div class="group">


                        <div
                            class="group-header"
                            data-bs-toggle="collapse"
                            data-bs-target="#${collapseId}">


                            <span>

                                <i
                                    class="bi bi-folder2 me-2">
                                </i>

                                ${escapeHTML(
                                    group
                                )}

                            </span>


                            <span
                                class="text-body-secondary">

                                ${industries.length}

                                <i
                                    class="bi
                                           bi-chevron-down
                                           ms-1">
                                </i>

                            </span>


                        </div>


                        <div
                            id="${collapseId}"
                            class="collapse show">


                            <div
                                class="industry-list">

                                ${industries
                                    .map(
                                        renderIndustryItem
                                    )
                                    .join("")}

                            </div>


                        </div>


                    </div>

                `;

            }
        )
        .join("");


    $$(".industry-item")
        .forEach(
            button => {

                button.addEventListener(
                    "click",
                    () => {

                        selectIndustry(
                            button.dataset.id
                        );

                    }
                );

            }
        );


    updateSidebarActive();

}



/* =========================================================
   SIDEBAR ITEM
========================================================= */

function renderIndustryItem(
    industry
) {

    const active =
        industry.id ===
        state.selectedIndustry
            ? "active"
            : "";


    const count =
        industry.companyCount ??
        countStocks(
            industry.id
        );


    return `

        <button
            class="industry-item ${active}"
            data-id="${escapeAttr(
                industry.id
            )}">


            <i class="bi bi-chevron-right"></i>


            <span
                class="text-truncate">

                ${escapeHTML(
                    industry.shortname ||

/* =========================================================
   SELECT INDUSTRY
========================================================= */

async function selectIndustry(
    industryId
) {

    if (!industryId)
        return;


    state.selectedIndustry =
        industryId;


    state.selectedStock =
        null;


    state.relationFilter =
        "all";


    state.currentIndustryDetail =
        null;


    updateSidebarActive();


    /*
     * 先立即顯示產業關聯圖
     */

    renderMap();


    /*
     * 關聯圖下方顯示 loading
     */

    renderIndustryDetailLoading();


    /*
     * 動態載入：
     *
     * data/{industryId}.json
     */

    try {

        const detail =
            await fetchIndustryDetail(
                industryId
            );


        /*
         * 防止使用者快速點擊其他產業
         *
         * 例如：
         *
         * 點 A
         * ↓
         * A 尚未載完
         * ↓
         * 點 B
         * ↓
         * B 載完
         * ↓
         * A 才載完
         *
         * 此時不能讓 A 蓋掉 B。
         */

        if (
            state.selectedIndustry !==
            industryId
        ) {

            return;

        }


        state.currentIndustryDetail =
            detail;


        /*
         * 顯示在中央關聯圖下面
         */

        renderIndustryDetailBelowMap(
            detail,
            industryId
        );


        /*
         * 同步更新右側資訊
         */

        renderIndustrySidePanel(
            detail,
            industryId
        );


    } catch (error) {

        console.error(
            "產業詳細資料載入失敗：",
            error
        );


        renderIndustryDetailError(
            industryId,
            error
        );

    }

}



/* =========================================================
   RENDER MAP
========================================================= */

function renderMap() {

    const industry =
        getIndustry(
            state.selectedIndustry
        );


    if (!industry)
        return;


    $("#map-toolbar")
        .classList.remove(
            "d-none"
        );


    renderBreadcrumb(
        industry
    );


    const relation =
        state.relations[
            state.selectedIndustry
        ] || {};


    let upstream =
        uniqueArray(
            relation.upstream
        );


    let downstream =
        uniqueArray(
            relation.downstream
        );


    let peers =
        uniqueArray(
            relation.peers
        );


    /*
     * 如果資料沒有直接關係，
     * 嘗試從其他產業的 relation
     * 建立反向關係。
     */

    if (
        !upstream.length &&
        !downstream.length &&
        !peers.length
    ) {

        const reverse =
            buildReverseRelations(
                state.selectedIndustry
            );


        upstream =
            reverse.upstream;


        downstream =
            reverse.downstream;


        peers =
            reverse.peers;

    }


    /*
     * Filter
     */

    if (
        state.relationFilter ===
        "upstream"
    ) {

        downstream = [];
        peers = [];

    }


    if (
        state.relationFilter ===
        "downstream"
    ) {

        upstream = [];
        peers = [];

    }


    if (
        state.relationFilter ===
        "peers"
    ) {

        upstream = [];
        downstream = [];

    }


    /*
     * 中央畫面
     */

    $("#map-content").className =
        "";


    $("#map-content").innerHTML = `

        <div
            class="container-fluid px-0">


            ${renderIndustryHero(
                industry
            )}


            ${renderRelationMap(
                upstream,
                downstream,
                peers
            )}


            <!--
                動態載入的
                data/{industryId}.json
                會插入這裡
            -->

            <div
                id="industry-detail-below-map">
            </div>


        </div>

    `;


    bindMapCards();

}

) {

        state.stockIndustries

        ([, industries]) =>
            Array.isArray(

            stockCode
    )
    .sort();

}



/* =========================================================
   REVERSE RELATIONS
========================================================= */

function buildReverseRelations(
    industryId
) {

    const result = {

        upstream: [],

        downstream: [],

        peers: []

    };


    Object.entries(
        state.relations
    )
    .forEach(
        ([source, relation]) => {


            if (
                relation.upstream?.includes(
                    industryId
                )
            ) {

                result.downstream.push(
                    source
                );

            }


            if (
                relation.downstream?.includes(
                    industryId
                )
            ) {

                result.upstream.push(
                    source
                );

            }


            if (
                relation.peers?.includes(
                    industryId
                )
            ) {

                result.peers.push(
                    source
                );

            }

        }
    );


    return {

        upstream:
            uniqueArray(
                result.upstream
            ),

        downstream:
            uniqueArray(
                result.downstream
            ),

        peers:
            uniqueArray(
                result.peers
            )

    };

}

function getIndustry(

) {

    return (

        state.industries[
            industryId

        {

            name:
                industryId,

            group:

function getIndustryName(

) {

    const industry =
        getIndustry(

/* =========================================================

========================================================= */

function toggleTheme() {

    const html =
        document.documentElement;


    const current =
        html.getAttribute(
            "data-bs-theme"
        );


    const next =
        current === "dark"
            ? "light"
            : "dark";


    html.setAttribute(
        "data-bs-theme",
        next
    );


    $("#themeBtn").innerHTML =

        next === "dark"

            ? `<i class="bi bi-sun"></i>`

            : `<i class="bi bi-moon"></i>`;

}

/* =========================================================
   UTILITIES
========================================================= */

function uniqueArray(
    array
) {

    if (
        !Array.isArray(
            array
        )
    ) {

        return [];

    }


    return [
        ...new Set(
            array.filter(
                Boolean
            )
        )
    ];

}



function escapeHTML(
    value
) {

    return String(
        value ?? ""
    )
    .replace(
        /[&<>"']/g,
        char => ({

            "&":
                "&amp;",

            "<":
                "&lt;",

            ">":
                "&gt;",

            '"':
                "&quot;",

            "'":
                "&#039;"

        })[char]
    );

}



function escapeAttr(
    value
) {

    return escapeHTML(
        value
    );

}
