<!doctype html>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
:root{--sidebar-width:310px;--right-width:380px}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden}
body{background:var(--bs-body-bg);color:var(--bs-body-color)}
#app{height:100vh;display:flex;flex-direction:column}
.app-navbar{flex:0 0 auto;z-index:1000}
.market-selector{min-width:120px}
.stock-search-wrapper{position:relative;width:280px}
.stock-search-results{position:absolute;top:calc(100% + .35rem);left:0;right:0;z-index:4000;max-height:360px;overflow-y:auto;background:var(--bs-body-bg);border:1px solid var(--bs-border-color);border-radius:.5rem;box-shadow:0 .5rem 1rem rgba(0,0,0,.12)}
.stock-search-item{display:flex;align-items:center;justify-content:space-between;gap:.75rem;width:100%;padding:.65rem .75rem;border:0;background:transparent;color:var(--bs-body-color);text-align:left;cursor:pointer}
.stock-search-item:hover{background:var(--bs-tertiary-bg)}
.stock-search-code{font-weight:700;font-size:.85rem}
.stock-search-name{font-size:.8rem;color:var(--bs-secondary-color);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stock-search-market{font-size:.68rem;color:var(--bs-secondary-color);white-space:nowrap}
.stock-topic-link,.stock-role-link{cursor:pointer}
.stock-topic-link:hover,.stock-role-link:hover{background:var(--bs-primary-bg-subtle);color:var(--bs-primary)}
@media(max-width:991.98px){.stock-search-wrapper{width:220px}}
@media(max-width:575.98px){.stock-search-wrapper{width:150px}.stock-search-results{max-height:300px}}
.app-body{min-height:0;flex:1;display:flex;overflow:hidden}
#sidebar{width:var(--sidebar-width);min-width:var(--sidebar-width);height:100%;border-right:1px solid var(--bs-border-color);background:var(--bs-body-bg);display:flex;flex-direction:column;overflow:hidden;transition:width .2s ease,min-width .2s ease}
#sidebar.collapsed{width:0;min-width:0;border-right:0}
.sidebar-header{padding:.75rem;border-bottom:1px solid var(--bs-border-color);flex:0 0 auto}
.industry-groups{flex:1;overflow-y:auto;padding:.5rem}
.group-header{display:flex;align-items:center;justify-content:space-between;padding:.65rem .75rem;margin-top:.2rem;font-weight:600;cursor:pointer;border-radius:.5rem}
.group-header:hover{background:var(--bs-tertiary-bg)}
.industry-list{padding-left:.5rem}
.industry-item{width:100%;text-align:left;border:0;background:transparent;padding:.55rem .75rem;border-radius:.45rem;color:var(--bs-body-color);display:flex;align-items:center;gap:.5rem;cursor:pointer}
.industry-item:hover{background:var(--bs-tertiary-bg)}
.industry-item.active{background:var(--bs-primary-bg-subtle);color:var(--bs-primary);font-weight:600}
.industry-count{margin-left:auto;font-size:.68rem}
#main-area{min-width:0;flex:1;height:100%;display:flex;flex-direction:column;overflow:hidden}
#main-tabs{flex:0 0 auto}
#tab-content-wrapper{min-height:0;flex:1;overflow:hidden}
.tab-pane-custom{height:100%;overflow:auto}
#detail-panel{width:var(--right-width);min-width:var(--right-width);height:100%;border-left:1px solid var(--bs-border-color);background:var(--bs-body-bg);display:flex;flex-direction:column;overflow:hidden;z-index:2000}
.detail-header{padding:.85rem 1rem;border-bottom:1px solid var(--bs-border-color);display:flex;align-items:center;justify-content:space-between;flex:0 0 auto}
#detail-content{flex:1;overflow-y:auto;padding:1rem}
.empty-state{min-height:70vh;display:flex;align-items:center;justify-content:center;text-align:center;color:var(--bs-secondary-color)}
.empty-state-icon{font-size:4rem;margin-bottom:1rem}
#map-toolbar{padding:.65rem 1rem;border-bottom:1px solid var(--bs-border-color);position:sticky;top:0;background:var(--bs-body-bg);z-index:20}
#map-scroll{padding:1.75rem}

.tag{display:inline-block;padding:.3rem .6rem;border-radius:999px;background:var(--bs-tertiary-bg);font-size:.78rem;margin-right:.25rem;margin-bottom:.25rem}
.relation-section{margin-top:2rem}

.relation-grid{display:grid;grid-template-columns:repeat(3,minmax(200px,1fr));gap:1.5rem;align-items:start}
.relation-column-title{font-size:.9rem;font-weight:700;margin-bottom:.75rem;display:flex;align-items:center;gap:.4rem}
.relation-cards{display:flex;flex-direction:column;gap:.65rem}

.legend{display:flex;align-items:center;gap:.5rem;font-size:.72rem;color:var(--bs-secondary-color)}

.stock-heatmap-title{display:flex;align-items:center;justify-content:space-between;margin-bottom:.75rem}
.stock-card-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:.65rem;margin-top:.85rem}
.news-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:1rem}
.news-card{height:100%;border:1px solid var(--bs-border-color);border-radius:.75rem;background:var(--bs-body-bg);padding:1rem;transition:.15s}
.news-card:hover{border-color:var(--bs-primary);box-shadow:0 .3rem 1rem rgba(0,0,0,.08);transform:translateY(-1px)}

.news-card-summary{font-size:.86rem;line-height:1.7;color:var(--bs-secondary-color)}
.news-meta{font-size:.72rem;color:var(--bs-secondary-color)}
.news-topic{cursor:pointer}
.mobile-detail-backdrop{display:none}
@media(max-width:1199.98px){#detail-panel{width:330px;min-width:330px}}
@media(max-width:991.98px){
html,body{overflow:auto}
#app{height:auto;min-height:100vh}
.app-body{display:block;overflow:visible}
#sidebar{width:100%;min-width:0;height:auto;max-height:42vh;border-right:0;border-bottom:1px solid var(--bs-border-color)}
#sidebar.collapsed{width:100%;min-width:0;max-height:0;border-bottom:0}
#main-area{height:auto;min-height:70vh;overflow:visible}
#tab-content-wrapper{overflow:visible}
.tab-pane-custom{height:auto;overflow:visible}
#detail-panel{display:none;position:fixed;right:0;bottom:0;width:min(100%,390px);min-width:0;height:min(90vh,760px);max-height:90vh;border:1px solid var(--bs-border-color);border-radius:1rem 1rem 0 0;box-shadow:0 -8px 30px rgba(0,0,0,.2);background:var(--bs-body-bg);z-index:3000}
#detail-panel.mobile-open{display:flex!important;visibility:visible!important;opacity:1!important}
#detail-content{max-height:calc(82vh - 58px);overflow-y:auto}
.mobile-detail-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.25);z-index:2999}
.mobile-detail-backdrop.show{display:block}
.relation-grid{grid-template-columns:1fr}
#map-scroll{padding:1rem}
#group-treemap,#sub-treemap{height:420px}
.heatmap-header{align-items:flex-start;flex-direction:column}
.market-selector{min-width:100px}
}
@media(max-width:575.98px){
.navbar-brand{font-size:1rem}
.navbar-brand i{display:none}
.market-selector{min-width:105px;width:auto;max-width:120px}

#heatmap-page{padding:.85rem .7rem 1.5rem}

.stock-card-grid{grid-template-columns:repeat(2,minmax(0,1fr))}

}
</style>
</head>

<script>
// ===== 設定與全域狀態 =====
const ss="ai"+"sto"+"ck"+"map";let updateTime="";
const CONFIG={
files:{
relations:"https://"+ss+".com/live/graph/global-chains.json",
stockIndustries:"https://"+ss+".com/live/company-topics-index.json",
industries:[
"https://"+ss+".com/live/topic-index-tw.json",
"https://"+ss+".com/live/topic-index-etf.json",
"https://"+ss+".com/live/topic-index-us.json",
"https://"+ss+".com/live/topic-index-jp.json",
"https://"+ss+".com/live/topic-index-kr.json"
],
heatmap:"https://"+ss+".com/live/heatmap-data.json",
news:"https://"+ss+".com/live/daily_news.json"
},
detailPath:"https://"+ss+".com/live/topics/",
api:{
proxy:"https://newsbeiter.onrender.com/api/fetch?url=",
batch:topicId=>"https://newsbeiter.onrender.com/api/fetch?url="+encodeURIComponent("https://"+ss+".com/api/data/company-topics-batch?topicId="+topicId),
company:(code,industryId)=>"https://newsbeiter.onrender.com/api/fetch?url="+encodeURIComponent(`https://${ss}.com/api/data/company-topic?code=${encodeURIComponent(code)}&topicId=${encodeURIComponent(industryId)}`),
heatmapLive:"https://newsbeiter.onrender.com/api/fetch?url="+encodeURIComponent("https://"+ss+".com/api/heatmap-live")
}
};
async function fetchJSON(url,options){
const response=await fetch(url,options);
if(!response.ok)throw new Error(`HTTP ${response.status}: ${url}`);
return response.json();
}
async function fetchHeatmapData(){
const heatmapDataURL=CONFIG.files.heatmap;
const heatmapLiveURL=CONFIG.api.heatmapLive;
let heatmapData=null;
let heatmapLive=null;
try{
heatmapData=await fetchJSON(heatmapDataURL);
}catch(error){
console.error("heatmap-data.json 載入失敗:",error);
}
try{
heatmapLive=await fetchJSON(heatmapLiveURL,{
method:"POST",
headers:{
"Content-Type":"application/json"
},
body:JSON.stringify({cacheKey:"all"})
});
}catch(error){
console.warn("heatmap-live 載入失敗，改用 heatmap-data.json:",error);
}
if(!heatmapData){
if(heatmapLive){
return convertHeatmapLiveToDataStructure(heatmapLive);
}
throw new Error("heatmap-data.json 與 heatmap-live 都無法取得");
}
if(!heatmapLive||!heatmapLive.fetchedAt){
return heatmapData;
}
const dataTime=Date.parse(heatmapData.lastUpdated);
const liveTime=Date.parse(heatmapLive.fetchedAt);
if(!Number.isFinite(dataTime)||!Number.isFinite(liveTime)){
console.warn("無法正確比較 heatmap-data.json.lastUpdated 與 heatmap-live.fetchedAt，使用 heatmap-data.json");
return heatmapData;
}
if(liveTime<=dataTime){
updateTime=new Date(dataTime).toISOString().slice(0,16).replace("T"," ");
return heatmapData;
}
updateTime=new Date(liveTime).toISOString().slice(0,16).replace("T"," ");
return mergeHeatmapLive(heatmapData,heatmapLive);
}
function mergeHeatmapLive(heatmapData,heatmapLive){
const result=structuredClone(heatmapData);
if(!result.topics||!heatmapLive.prices){
return result;
}
Object.values(result.topics).forEach(topic=>{
if(!Array.isArray(topic.companies))return;
topic.companies.forEach(company=>{
const live=heatmapLive.prices[String(company.code)];
if(!live)return;
if(live.price!==undefined&&live.price!==null){
company.price=live.price;
}
if(live.change1D!==undefined&&live.change1D!==null){
company.change1D=live.change1D;
}
});
});
result.lastUpdated=heatmapLive.fetchedAt;
return result;
}

lastUpdated:heatmapLive.fetchedAt||null,
topics:{}
};

async function loadData(){
try{
showLoading();
const industryResults=await Promise.allSettled(CONFIG.files.industries.map(url=>fetchJSON(url)));
const [relationsResult,stockIndustriesResult,heatmapResult,newsResult]=await Promise.allSettled([fetchJSON(CONFIG.files.relations),fetchJSON(CONFIG.files.stockIndustries),fetchHeatmapData(),fetchJSON(CONFIG.files.news)]);
const industryArrays=[];
industryResults.forEach((result,index)=>{
if(result.status==="fulfilled")industryArrays.push({data:result.value,market:MARKET_DEFS[index]?.key||"other"});
else console.error("Industry source failed:",CONFIG.files.industries[index],result.reason);
});
const industries=industryArrays.flatMap(source=>normalizeIndustries(source.data).map(industry=>({...industry,market:industry.market||source.market})));
state.relations=relationsResult.status==="fulfilled"?normalizeObject(relationsResult.value):{};
state.stockIndustries=stockIndustriesResult.status==="fulfilled"?normalizeObject(stockIndustriesResult.value):{};
state.industriesArray=normalizeIndustries(industries);
state.industries={};
state.industriesArray.forEach(industry=>state.industries[industry.id]=industry);
state.heatmapData=heatmapResult.status==="fulfilled"?(heatmapResult.value||{topics:{}}):{topics:{}};
state.news=newsResult.status==="fulfilled"?(Array.isArray(newsResult.value)?newsResult.value:[]):[];
buildStockSearchIndex();
buildMarketSelector();
renderIndustryGroups();
renderHeatmap();
if(state.currentTab==="news")renderNews();
if(state.selectedIndustry&&isIndustryInCurrentMarket(state.selectedIndustry)){
renderMap();
if(state.currentIndustryDetail)renderIndustryDetailBelowMap(state.currentIndustryDetail,state.selectedIndustry,state.currentBatch);
}
}catch(error){
console.error(error);
showLoadError(error);
}
}

async function fetchAPI(url){
const response=await fetch(url);
if(!response.ok)throw new Error(`${url} HTTP ${response.status}`);
return await response.json();
}
async function fetchIndustryDetail(industryId){
return await fetchJSON(CONFIG.detailPath+encodeURIComponent(industryId)+".json");
}
async function fetchCompanyTopicsBatch(industryId){
if(state.apiBatchCache[industryId])return state.apiBatchCache[industryId];
const data=await fetchAPI(CONFIG.api.batch(industryId));
state.apiBatchCache[industryId]=data;
return data;
}
async function fetchCompanyTopic(code,industryId){
const key=`${code}|${industryId}`;
if(state.apiCompanyCache[key])return state.apiCompanyCache[key];
const data=await fetchAPI(CONFIG.api.company(code,industryId));
state.apiCompanyCache[key]=data;
return data;
}
function normalizeObject(value){
return value&&typeof value==="object"&&!Array.isArray(value)?value:{};
}
function normalizeIndustries(data){
if(Array.isArray(data))return data.filter(x=>x&&x.id);
if(data&&typeof data==="object")return Object.entries(data).map(([id,value])=>typeof value==="string"?{id,name:value,shortname:value,group:"其他"}:{id,...value});
return[];
}
function getGroup(industry){
return industry?.group||industry?.category||industry?.parent||"其他";
}
function getIndustry(industryId){
return state.industries[industryId]||{id:industryId,name:industryId,shortname:industryId,group:"其他",market:"other"};
}
function getIndustryName(industryId){
const industry=getIndustry(industryId);
return industry.shortname||industry.name||industryId;
}
function getMarketLabel(market){
return MARKET_DEFS.find(item=>item.key===market)?.label||market||"其他";
}
function isIndustryInCurrentMarket(industryId){
if(state.market==="all")return true;
return getIndustry(industryId).market===state.market;
}
function isRelationInCurrentMarket(industryId){
return isIndustryInCurrentMarket(industryId);
}
function getMarketIndustries(){
return state.industriesArray.filter(industry=>state.market==="all"||industry.market===state.market);
}
function getHeatmapCompanies(industryId){
const companies=state.heatmapData?.topics?.[industryId]?.companies;
return Array.isArray(companies)?companies:[];
}
function countStocks(industryId){
const companies=getHeatmapCompanies(industryId);
if(companies.length)return companies.length;
return Object.values(state.stockIndustries).filter(ids=>Array.isArray(ids)&&ids.includes(industryId)).length;
}
function buildStockSearchIndex(){
const map=new Map();
Object.values(state.heatmapData?.topics||{}).forEach(topic=>{
(topic.companies||[]).forEach(company=>{
const code=String(company.code||"").trim();
if(!code)return;
const existing=map.get(code);
if(!existing||(!existing.name&&(company.name||company.companyName)))map.set(code,{...company,code});
});
});
state.stockSearchIndex=[...map.values()].sort((a,b)=>String(a.code).localeCompare(String(b.code)));
}
function getCompanyIndustryIds(code){
const ids=new Set();
const target=String(code);
const mapped=state.stockIndustries?.[target];
if(Array.isArray(mapped))mapped.forEach(id=>ids.add(String(id)));
Object.entries(state.stockIndustries||{}).forEach(([key,value])=>{
if(String(key)===target&&Array.isArray(value))value.forEach(id=>ids.add(String(id)));
});
Object.entries(state.heatmapData?.topics||{}).forEach(([industryId,topic])=>{
if((topic.companies||[]).some(company=>String(company.code)===target))ids.add(String(industryId));
});
return [...ids].filter(id=>state.industries[id]);
}

function renderIndustryGroups(filter=""){
const container=$("#industryGroups");
const keyword=filter.trim().toLowerCase();

filtered.forEach(industry=>{
const group=getGroup(industry);
if(!groups[group])groups[group]=[];
groups[group].push(industry);
});
const groupNames=Object.keys(groups).sort();

container.innerHTML=`<div class="text-center text-body-secondary p-4">找不到符合條件的產業</div>`;

container.innerHTML=groupNames.map((group,index)=>{

}).join("");

return `<button class="industry-item ${active}" data-id="${escapeAttr(industry.id)}"><i class="bi bi-chevron-right"></i><span class="text-truncate">${escapeHTML(industry.shortname||industry.name||industry.id)}</span>${count?`<span class="badge text-bg-secondary industry-count">${count}</span>`:""}</button>`;

async function selectIndustry(industryId,options={}){
if(!industryId||!isIndustryInCurrentMarket(industryId))return;
const fromHeatmap=options.fromHeatmap===true;
state.selectedIndustry=industryId;
state.currentIndustryDetail=null;
state.currentBatch=null;
state.relationFilter="all";
updateSidebarActive();
if(!fromHeatmap)switchTab("map");
renderMap();
renderIndustryDetailLoading();
try{
const [detailResult,batchResult]=await Promise.allSettled([fetchIndustryDetail(industryId),fetchCompanyTopicsBatch(industryId)]);
if(state.selectedIndustry!==industryId)return;
const detail=detailResult.status==="fulfilled"?detailResult.value:null;
const batch=batchResult.status==="fulfilled"?batchResult.value:{items:[],error:batchResult.reason?.message||"Batch API 取得失敗"};
state.currentIndustryDetail=detail;
state.currentBatch=batch;
renderIndustryDetailBelowMap(detail,industryId,batch);
if(detailResult.status==="rejected")console.error("Industry detail failed:",detailResult.reason);
if(batchResult.status==="rejected")console.error("Batch API failed:",batchResult.reason);
}catch(error){

const reverse=buildReverseRelations(state.selectedIndustry);

}

function renderCompanyTreemap(container,companies,period,onClick){
if(!container)return;

}
const field=period||"change1D";
const changes=companies.map(company=>Number(company[field])).filter(Number.isFinite);
const maxPositive=Math.max(...changes.filter(value=>value>0),0);
const maxNegative=Math.max(...changes.filter(value=>value<0).map(value=>Math.abs(value)),0);
const root=d3.hierarchy({children:companies}).sum(d=>Math.max(0,Number(d.marketCap)||0)).sort((a,b)=>b.value-a.value);
const width=container.clientWidth||800;
const height=container.clientHeight||350;
d3.treemap().size([width,height]).paddingInner(2).paddingOuter(1).round(true)(root);
container.innerHTML="";
root.leaves().forEach(leaf=>{
const company=leaf.data;
const node=document.createElement("div");
node.className="treemap-node";
const nodeWidth=Math.max(1,leaf.x1-leaf.x0);
const nodeHeight=Math.max(1,leaf.y1-leaf.y0);
node.style.left=leaf.x0+"px";
node.style.top=leaf.y0+"px";
node.style.width=nodeWidth+"px";
node.style.height=nodeHeight+"px";
const maxChange=Number(company[field])>0?maxPositive:maxNegative;
node.style.background=getHeatmapColor(company[field],maxChange);
const fonts=getAdaptiveFonts(nodeWidth,nodeHeight,window.innerWidth,company.name||company.companyName||company.code,true);
node.dataset.companyCode=company.code;
node.dataset.companyIndustry=state.selectedIndustry||"";
node.innerHTML=`<div class="treemap-node-company" style="font-size:${fonts.label}px">${escapeHTML(company.name||company.companyName||company.code)}</div><div class="treemap-node-company-change" style="font-size:${fonts.change}px">${formatChange(company[field])}</div>`;
node.title=`${company.code} ${company.name||company.companyName||""}｜${periodLabel(field)} ${formatChange(company[field])}`;
node.addEventListener("click",()=>onClick(company));
container.appendChild(node);
});

async function selectCompany(code,industryId){
state.selectedStock=String(code);
const company=findCompany(code)||state.stockSearchIndex.find(item=>String(item.code)===String(code))||{code,name:code};
const industryIds=getCompanyIndustryIds(code);
const validIndustryIds=industryIds.filter(id=>state.industries[id]);
if(!industryId||!state.industries[industryId])industryId=validIndustryIds.find(id=>state.market==="all"||isIndustryInCurrentMarket(id))||validIndustryIds[0]||null;
state.selectedCompanyIndustry=industryId;
renderCompanySidePanel(company,validIndustryIds,[],{loading:true});
openDetailPanel();
try{
if(!industryIds.length){
renderCompanySidePanel(company,validIndustryIds,[],{error:"找不到此個股所屬的產業。"});
return;
}
const results=await Promise.allSettled(validIndustryIds.map(id=>fetchCompanyTopic(code,id)));
if(String(state.selectedStock)!==String(code))return;
const roleMap=[];
const apiDetails=[];
results.forEach((result,index)=>{
if(result.status!=="fulfilled"||!result.value)return;
const data=result.value;
apiDetails.push({industryId:validIndustryIds[index],data});
const roles=Array.isArray(data.relation?.roles)?data.relation.roles:[];
roles.forEach(role=>roleMap.push({role,industryId:validIndustryIds[index],data}));
});
renderCompanySidePanel(company,validIndustryIds,roleMap,{apiDetails});
}catch(error){
console.error(error);
if(String(state.selectedStock)!==String(code))return;
renderCompanySidePanel(company,validIndustryIds,[],{error:"無法取得個股產業角色資料，但上方已取得的個股資訊仍可使用。"});
}
}

function renderHeatmap(){

return;
}

renderSubHeatmap(container);
return;
}
renderGroupHeatmap(container);

function buildHeatmapData(){
const topics=state.heatmapData?.topics||{};
const subIndustries=[];
Object.entries(topics).forEach(([industryId,topic])=>{
const industry=getIndustry(industryId);
if(!isIndustryInCurrentMarket(industryId))return;
const companies=Array.isArray(topic.companies)?topic.companies:[];
if(!companies.length)return;
subIndustries.push({id:industryId,name:topic.displayName||industry.shortname||industry.name||industryId,group:getGroup(industry),market:industry.market,companies,marketCap:sumMarketCap(companies),change1D:weightedAverage(companies,"change1D"),change1W:weightedAverage(companies,"change1W"),change1M:weightedAverage(companies,"change1M")});
});
const groupMap={};
subIndustries.forEach(item=>{
if(!groupMap[item.group])groupMap[item.group]=[];
groupMap[item.group].push(item);
});
const groups=Object.entries(groupMap).map(([name,items])=>{
const companies=items.flatMap(item=>item.companies);
return{name,items,companies,marketCap:sumMarketCap(companies),change1D:weightedAverage(companies,"change1D"),change1W:weightedAverage(companies,"change1W"),change1M:weightedAverage(companies,"change1M")};
});
return{subIndustries,groups};
}
function renderGroupHeatmap(container){
const data=buildHeatmapData();

const groups=[...data.groups].sort((a,b)=>(b[field]??-Infinity)-(a[field]??-Infinity));
container.innerHTML=`<div class="heatmap-header"><div><div class="heatmap-title">產業 Heatmap</div><div class="heatmap-subtitle">${escapeHTML(getMarketLabel(state.market))}｜第一層：大產業｜方塊面積依 Market Cap 計算</div></div><div class="d-flex flex-wrap align-items-center gap-3"><div class="btn-group btn-group-sm period-buttons"><button class="btn ${field==="change1D"?"btn-primary":"btn-outline-primary"}" data-period="change1D">1日</button><button class="btn ${field==="change1W"?"btn-primary":"btn-outline-primary"}" data-period="change1W">1週</button><button class="btn ${field==="change1M"?"btn-primary":"btn-outline-primary"}" data-period="change1M">1個月</button></div><div class="legend"><span>跌</span><div class="legend-bar"></div><span>漲</span></div></div></div><div class="ranking-section"><div class="ranking-title">大產業漲跌幅排名 <span id="updateTime" class="heatmap-subtitle">${updateTime}</span></div><div class="ranking-list">${groups.map((group,index)=>`<div class="ranking-item" data-group-name="${escapeAttr(group.name)}"><span class="ranking-number">${index+1}</span><span class="ranking-name">${escapeHTML(group.name)}</span><span class="ranking-change ${getChangeClass(group[field])}">${formatChange(group[field])}</span></div>`).join("")}</div></div><div class="mb-2 d-flex justify-content-between"><span class="fw-bold">大產業地毯圖</span><span class="small text-body-secondary">點擊進入子產業</span></div><div id="group-treemap" class="treemap-wrapper"></div>`;
renderPeriodButtons();
renderTreemap($("#group-treemap"),groups,field,group=>selectHeatmapGroup(group.name));
bindHeatmapEvents();
}
function renderSubHeatmap(container){
const data=buildHeatmapData();
const group=data.groups.find(group=>group.name===state.selectedGroup);
if(!group){
state.heatmapLevel="group";
state.selectedGroup=null;
renderHeatmap();
return;
}
const field=state.heatmapPeriod;
const items=[...group.items].sort((a,b)=>(b[field]??-Infinity)-(a[field]??-Infinity));
container.innerHTML=`<div class="heatmap-header"><div><div class="heatmap-breadcrumb"><button class="btn btn-link btn-sm p-0" id="backGroupHeatmap">全部大產業</button> / ${escapeHTML(group.name)}</div><div class="heatmap-title">${escapeHTML(group.name)}</div><div class="heatmap-subtitle">${escapeHTML(getMarketLabel(state.market))}｜第二層：子產業｜點擊子產業進入產業關聯圖</div></div><div class="d-flex flex-wrap align-items-center gap-3"><div class="btn-group btn-group-sm period-buttons"><button class="btn ${field==="change1D"?"btn-primary":"btn-outline-primary"}" data-period="change1D">1日</button><button class="btn ${field==="change1W"?"btn-primary":"btn-outline-primary"}" data-period="change1W">1週</button><button class="btn ${field==="change1M"?"btn-primary":"btn-outline-primary"}" data-period="change1M">1個月</button></div><div class="legend"><span>跌</span><div class="legend-bar"></div><span>漲</span></div></div></div><div class="ranking-section"><div class="ranking-title">子產業漲跌幅排名</div><div class="ranking-list">${items.map((item,index)=>`<div class="ranking-item" data-industry-id="${escapeAttr(item.id)}"><span class="ranking-number">${index+1}</span><span class="ranking-name">${escapeHTML(item.name)}</span><span class="ranking-change ${getChangeClass(item[field])}">${formatChange(item[field])}</span></div>`).join("")}</div></div><div class="mb-2 d-flex justify-content-between"><span class="fw-bold">${escapeHTML(group.name)}｜子產業地毯圖</span><span class="small text-body-secondary">點擊產業後會同步準備產業關聯圖</span></div><div id="sub-treemap" class="treemap-wrapper"></div>`;
renderPeriodButtons();
renderTreemap($("#sub-treemap"),items,field,item=>selectIndustry(item.id,{fromHeatmap:true}));
$("#backGroupHeatmap").addEventListener("click",()=>{
state.heatmapLevel="group";
state.selectedGroup=null;
state.selectedSubIndustry=null;
renderHeatmap();
});
bindHeatmapEvents();
}
function renderPeriodButtons(){
$$("[data-period]").forEach(button=>{
if(button.dataset.bound)return;
button.dataset.bound="1";
button.addEventListener("click",()=>{
state.heatmapPeriod=button.dataset.period;
renderHeatmap();
});
});
}
function getAdaptiveFonts(width,height,viewportWidth,name,isCompany=false){
const area=Math.max(1,width*height);
const shortest=Math.min(width,height);
const charFactor=Math.max(1,String(name||"").length/8);
const base=Math.sqrt(area)*.16;
const responsive=viewportWidth<576?.78:viewportWidth<768?.88:1;
let label=Math.max(isCompany?8:9,Math.min(isCompany?20:24,base,shortest*.24,viewportWidth*.035))*responsive;
label=Math.max(isCompany?8:9,label/Math.min(charFactor,2.2));
let change=Math.max(isCompany?8:9,Math.min(isCompany?16:19,label*.78));
if(height<32)change=0;
return{label:Math.round(label*10)/10,change:Math.round(change*10)/10};
}
function renderTreemap(container,items,field,onClick){
if(!container)return;
if(!items.length){
container.innerHTML=`<div class="heatmap-empty">沒有資料</div>`;
return;
}
const changes=items.map(item=>Number(item[field])).filter(Number.isFinite);
const maxPositive=Math.max(...changes.filter(value=>value>0),0);
const maxNegative=Math.max(...changes.filter(value=>value<0).map(value=>Math.abs(value)),0);
const root=d3.hierarchy({children:items}).sum(d=>Math.max(0,Number(d.marketCap)||0)).sort((a,b)=>b.value-a.value);
const width=container.clientWidth||900;
const height=container.clientHeight||500;
d3.treemap().size([width,height]).paddingInner(2).paddingOuter(1).round(true)(root);
container.innerHTML="";
root.leaves().forEach(leaf=>{
const item=leaf.data;
const node=document.createElement("div");
node.className="treemap-node";
const nodeWidth=Math.max(1,leaf.x1-leaf.x0);
const nodeHeight=Math.max(1,leaf.y1-leaf.y0);
node.style.left=leaf.x0+"px";
node.style.top=leaf.y0+"px";
node.style.width=nodeWidth+"px";
node.style.height=nodeHeight+"px";
const maxChange=Number(item[field])>0?maxPositive:maxNegative;
node.style.background=getHeatmapColor(item[field],maxChange);
const fonts=getAdaptiveFonts(nodeWidth,nodeHeight,window.innerWidth,item.name,false);
node.innerHTML=`<div class="treemap-node-label" style="font-size:${fonts.label}px">${escapeHTML(item.name)}</div>${fonts.change?`<div class="treemap-node-change" style="font-size:${fonts.change}px">${formatChange(item[field])}</div>`:""}`;
node.title=`${item.name}｜${periodLabel(field)} ${formatChange(item[field])}`;
node.addEventListener("click",()=>onClick(item));
container.appendChild(node);
});
}
function selectHeatmapGroup(groupName){
state.selectedGroup=groupName;
state.heatmapLevel="sub";
renderHeatmap();
}
function bindHeatmapEvents(){
$$("[data-group-name]").forEach(element=>{
if(element.dataset.bound)return;
element.dataset.bound="1";
element.addEventListener("click",()=>selectHeatmapGroup(element.dataset.groupName));
});
$$("[data-industry-id]").forEach(element=>{
if(element.dataset.bound)return;
element.dataset.bound="1";
element.addEventListener("click",()=>selectIndustry(element.dataset.industryId,{fromHeatmap:true}));
});
}
// ===== Heatmap 計算與顏色 =====
function weightedAverage(companies,field){
let weightedSum=0,totalWeight=0;
companies.forEach(company=>{
const value=Number(company[field]);
const weight=Number(company.marketCap);
if(Number.isFinite(value)&&Number.isFinite(weight)&&weight>0){
weightedSum+=value*weight;
totalWeight+=weight;
}
});
return totalWeight?weightedSum/totalWeight:null;
}
function sumMarketCap(companies){
return companies.reduce((sum,company)=>{
const value=Number(company.marketCap);
return sum+(Number.isFinite(value)&&value>0?value:0);
},0);
}
function getHeatmapColor(change,maxChange){
const value=Number(change);
if(!Number.isFinite(value))return "#adb5bd";
const max=Math.max(Number(maxChange)||.01,.01);
const ratio=Math.min(Math.abs(value)/max,1);
if(value>0){
const r=Math.round(220-(220-25)*ratio);
const g=Math.round(245-(245-135)*ratio);
const b=Math.round(220-(220-84)*ratio);
return `rgb(${r},${g},${b})`;
}
if(value<0){
const r=Math.round(220-(220-180)*ratio);
const g=Math.round(120-(120-35)*ratio);
const b=Math.round(120-(120-40)*ratio);
return `rgb(${r},${g},${b})`;
}
return "#adb5bd";
}
// ===== 共用格式化與 UI 工具 =====
function formatMarketCap(value){
const number=Number(value);
if(!Number.isFinite(number))return "-";
if(number>=1e12)return `${(number/1e12).toFixed(2)}T`;
if(number>=1e9)return `${(number/1e9).toFixed(1)}B`;
if(number>=1e6)return `${(number/1e6).toFixed(0)}M`;
return number.toLocaleString("zh-TW");
}
function formatNumber(value){
const number=Number(value);
return Number.isFinite(number)?number.toLocaleString("zh-TW",{maximumFractionDigits:2}):"-";
}
function formatChange(value){
const number=Number(value);
return Number.isFinite(number)?`${number>0?"+":""}${number.toFixed(2)}%`:"-";
}
function getChangeClass(value){
const number=Number(value);
if(number>0)return"text-up";
if(number<0)return"text-down";
return"text-body-secondary";
}
function periodLabel(field){
if(field==="change1W")return"1週";
if(field==="change1M")return"1個月";
return"1日";
}
function buildReverseRelations(industryId){
const result={upstream:[],downstream:[],peers:[]};
Object.entries(state.relations).forEach(([source,relation])=>{
if(!isRelationInCurrentMarket(source))return;
if(relation.upstream?.includes(industryId)&&isRelationInCurrentMarket(source))result.downstream.push(source);
if(relation.downstream?.includes(industryId)&&isRelationInCurrentMarket(source))result.upstream.push(source);
if(relation.peers?.includes(industryId)&&isRelationInCurrentMarket(source))result.peers.push(source);
});
return{upstream:uniqueArray(result.upstream),downstream:uniqueArray(result.downstream),peers:uniqueArray(result.peers)};
}
function renderBreadcrumb(industry){
$("#breadcrumb").innerHTML=`<nav aria-label="breadcrumb"><ol class="breadcrumb mb-0 small"><li class="breadcrumb-item">${escapeHTML(getMarketLabel(state.market))}</li><li class="breadcrumb-item">${escapeHTML(getGroup(industry))}</li><li class="breadcrumb-item active">${escapeHTML(industry.shortname||industry.name||industry.id)}</li></ol></nav>`;
}
function clearDetailPanel(){
$("#detail-panel-title").textContent="詳細資訊";
$("#detail-content").innerHTML=`<div class="text-center text-body-secondary p-4">點擊產業或個股查看詳細資訊</div>`;
$("#detail-panel").classList.remove("mobile-open");
$("#mobileDetailBackdrop").classList.remove("show");
}

panel.classList.add("mobile-open");

}
function toggleSidebar(){
const sidebar=$("#sidebar");
const collapsed=sidebar.classList.toggle("collapsed");
state.sidebarCollapsed=collapsed;
$("#sidebarToggle").innerHTML=collapsed?`<i class="bi bi-layout-sidebar-inset"></i>`:`<i class="bi bi-layout-sidebar"></i>`;

function toggleTheme(){
const html=document.documentElement;
const next=html.getAttribute("data-bs-theme")==="dark"?"light":"dark";
html.setAttribute("data-bs-theme",next);
$("#themeBtn").innerHTML=next==="dark"?`<i class="bi bi-sun"></i>`:`<i class="bi bi-moon"></i>`;
}
function switchTab(tab){
state.currentTab=tab;
$$("#main-tabs .nav-link").forEach(button=>button.classList.toggle("active",button.dataset.tab===tab));
$("#map-tab").classList.toggle("d-none",tab!=="map");
$("#heatmap-tab").classList.toggle("d-none",tab!=="heatmap");
$("#news-tab").classList.toggle("d-none",tab!=="news");
if(tab==="heatmap")renderHeatmap();
if(tab==="news")renderNews();
if(tab==="map"&&state.selectedIndustry)renderMap();
}
function showLoading(){
$("#industryGroups").innerHTML=`<div class="text-center p-4"><div class="spinner-border spinner-border-sm text-primary mb-2"></div><div class="small text-body-secondary">載入產業資料...</div></div>`;
}
function showLoadError(error){
$("#industryGroups").innerHTML=`<div class="alert alert-danger m-2"><div class="fw-bold mb-2">JSON 載入失敗</div><div class="small">${escapeHTML(error.message)}</div></div>`;

const container=$("#industry-detail-below-map");
if(!container)return;
const companies=getHeatmapCompanies(industryId);
container.innerHTML=`<section class="relation-section"><div class="alert alert-warning"><div class="fw-bold">產業詳細資料暫時無法載入</div><div class="small mt-2">${escapeHTML(error.message)}</div></div>${renderIndustryCompanies(companies,industryId)}</section>`;
renderIndustryStockTreemap(industryId);
}
function uniqueArray(array){
return Array.isArray(array)?[...new Set(array.filter(Boolean))]:[];
}
function sanitizeId(value){
return String(value).replace(/[^a-zA-Z0-9_-]/g,"_");
}
function escapeHTML(value){
return String(value??"").replace(/[&<>"']/g,char=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[char]));
}
function escapeAttr(value){
return escapeHTML(value);
}
window.addEventListener("resize",()=>{
if(state.currentTab==="heatmap")requestAnimationFrame(()=>renderHeatmap());
if(state.currentTab==="map"&&state.selectedIndustry&&window.innerWidth>991)requestAnimationFrame(()=>renderMap());
});
</script>
