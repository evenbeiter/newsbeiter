<!doctype html>
<html lang="zh-Hant" data-bs-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>產業地圖</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.css" rel="stylesheet">
<style>
:root{
    --sidebar-width:310px;
    --sidebar-collapsed-width:0px;
    --right-width:360px;
    --node-border:#dee2e6;
    --node-bg:#fff;
    --node-hover:#f1f5f9;
}
body{
    margin:0;
    overflow:hidden;
}
#app{
    height:100vh;
    display:flex;
    flex-direction:column;
}
.app-navbar{
    flex:0 0 auto;
    z-index:1000;
}
.app-body{
    min-height:0;
    flex:1;
    display:flex;
    overflow:hidden;
}
#sidebar{
    width:var(--sidebar-width);
    min-width:var(--sidebar-width);
    border-right:1px solid var(--bs-border-color);
    background:var(--bs-body-bg);
    display:flex;
    flex-direction:column;
    overflow:hidden;
    transition:width .2s ease,min-width .2s ease;
    z-index:100;
}
#sidebar.collapsed{
    width:0;
    min-width:0;
    border-right:0;
}
.sidebar-header{
    padding:1rem;
    border-bottom:1px solid var(--bs-border-color);
    flex:0 0 auto;
}
.industry-groups{
    flex:1;
    overflow-y:auto;
    padding:.5rem;
}
.group-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:.65rem .75rem;
    margin-top:.25rem;
    font-weight:600;
    cursor:pointer;
    border-radius:.5rem;
}
.group-header:hover{
    background:var(--bs-tertiary-bg);
}
.industry-list{
    padding-left:.5rem;
}
.industry-item{
    width:100%;
    text-align:left;
    border:0;
    background:transparent;
    padding:.55rem .75rem;
    border-radius:.45rem;
    color:var(--bs-body-color);
    display:flex;
    align-items:center;
    gap:.5rem;
    cursor:pointer;
}
.industry-item:hover{
    background:var(--bs-tertiary-bg);
}
.industry-item.active{
    background:var(--bs-primary-bg-subtle);
    color:var(--bs-primary);
    font-weight:600;
}
.industry-count{
    margin-left:auto;
    font-size:.7rem;
}
#main-area{
    min-width:0;
    flex:1;
    display:flex;
    flex-direction:column;
    overflow:hidden;
}
#tab-content-wrapper{
    min-height:0;
    flex:1;
    overflow:hidden;
}
.tab-pane-custom{
    height:100%;
    overflow:auto;
}
#map-toolbar{
    padding:.65rem 1rem;
    border-bottom:1px solid var(--bs-border-color);
    position:sticky;
    top:0;
    background:var(--bs-body-bg);
    z-index:20;
}
#map-scroll{
    padding:2rem;
}
.industry-title{
    font-weight:700;
    letter-spacing:-.02em;
}
.industry-description{
    max-width:1100px;
    line-height:1.8;
}
.tag{
    display:inline-block;
    padding:.3rem .6rem;
    border-radius:999px;
    background:var(--bs-tertiary-bg);
    font-size:.8rem;
    margin-right:.25rem;
    margin-bottom:.25rem;
}
.relation-section{
    margin-top:2rem;
}
.relation-title{
    display:flex;
    align-items:center;
    gap:.5rem;
    margin-bottom:1rem;
    font-weight:700;
}
.relation-grid{
    display:grid;
    grid-template-columns:repeat(3,minmax(220px,1fr));
    gap:1.5rem;
    align-items:start;
}
.relation-column-title{
    font-size:.9rem;
    font-weight:700;
    margin-bottom:.75rem;
    display:flex;
    align-items:center;
    gap:.4rem;
}
.relation-cards{
    display:flex;
    flex-direction:column;
    gap:.65rem;
}
.relation-card{
    border:1px solid var(--node-border);
    background:var(--node-bg);
    border-radius:.75rem;
    padding:.8rem;
    cursor:pointer;
    transition:transform .12s ease,box-shadow .12s ease,background .12s ease;
}
.relation-card:hover{
    transform:translateY(-2px);
    box-shadow:0 .3rem 1rem rgba(0,0,0,.08);
    background:var(--node-hover);
}
.relation-card-name{
    font-weight:600;
    line-height:1.4;
}
.relation-card-id{
    font-size:.7rem;
    opacity:.6;
    margin-top:.2rem;
}
.relation-empty{
    border:1px dashed var(--bs-border-color);
    border-radius:.75rem;
    padding:1rem;
    text-align:center;
    opacity:.6;
    font-size:.85rem;
}
.detail-block{
    margin-top:2rem;
}
.detail-block-title{
    font-weight:700;
    margin-bottom:1rem;
}
.supply-chain-wrapper{
    overflow-x:auto;
    padding-bottom:.75rem;
}
.supply-chain{
    display:flex;
    gap:1.5rem;
    align-items:stretch;
    min-width:max-content;
}
.supply-segment{
    width:250px;
    border:1px solid var(--bs-border-color);
    border-radius:.75rem;
    padding:.9rem;
    background:var(--bs-tertiary-bg);
}
.supply-segment-title{
    font-weight:700;
    margin-bottom:.25rem;
}
.supply-segment-subtitle{
    font-size:.78rem;
    opacity:.7;
    margin-bottom:.75rem;
}
.supply-child{
    background:var(--bs-body-bg);
    border:1px solid var(--bs-border-color);
    border-radius:.6rem;
    padding:.65rem;
    margin-top:.5rem;
    cursor:pointer;
}
.supply-child:hover{
    border-color:var(--bs-primary);
}
.supply-child-name{
    font-weight:600;
    font-size:.85rem;
}
.supply-child-subtitle{
    font-size:.72rem;
    opacity:.7;
    margin-top:.2rem;
}
.metric-card{
    height:100%;
    border:1px solid var(--bs-border-color);
    border-radius:.75rem;
    padding:1rem;
    background:var(--bs-tertiary-bg);
}
.metric-value{
    font-size:1.15rem;
    font-weight:700;
}
.metric-label{
    font-size:.78rem;
    opacity:.65;
    margin-bottom:.2rem;
}
.company-card{
    border:1px solid var(--bs-border-color);
    border-radius:.65rem;
    padding:.75rem;
    height:100%;
    cursor:pointer;
    transition:.15s;
}
.company-card:hover{
    background:var(--bs-tertiary-bg);
    border-color:var(--bs-primary);
    transform:translateY(-1px);
}
.company-code{
    font-weight:700;
    font-size:.9rem;
}
.company-name{
    font-size:.85rem;
    margin-top:.25rem;
}
.company-price{
    font-size:.75rem;
    margin-top:.45rem;
}
.text-up{
    color:#dc3545!important;
}
.text-down{
    color:#198754!important;
}
#detail-panel{
    width:var(--right-width);
    min-width:var(--right-width);
    border-left:1px solid var(--bs-border-color);
    background:var(--bs-body-bg);
    display:flex;
    flex-direction:column;
    overflow:hidden;
}
.detail-header{
    padding:1rem;
    border-bottom:1px solid var(--bs-border-color);
    display:flex;
    align-items:center;
    justify-content:space-between;
}
#detail-content{
    flex:1;
    overflow-y:auto;
    padding:1rem;
}
.empty-state{
    min-height:60vh;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    opacity:.65;
}
.empty-state-icon{
    font-size:4rem;
    margin-bottom:1rem;
}
#heatmap-page{
    padding:1.5rem;
}
.heatmap-ranking-section{
    margin-bottom:2rem;
}
.ranking-title{
    font-size:1.05rem;
    font-weight:700;
    margin-bottom:.8rem;
}
.ranking-list{
    display:flex;
    flex-wrap:wrap;
    gap:.6rem;
}
.ranking-item{
    display:flex;
    align-items:center;
    gap:.6rem;
    border:1px solid var(--bs-border-color);
    border-radius:.6rem;
    padding:.55rem .75rem;
    background:var(--bs-body-bg);
    cursor:pointer;
}
.ranking-item:hover{
    background:var(--bs-tertiary-bg);
}
.ranking-number{
    font-weight:700;
    opacity:.6;
    min-width:24px;
}
.ranking-name{
    font-weight:600;
}
.ranking-change{
    font-weight:700;
}
.heatmap-section{
    margin-top:1.5rem;
}
.heatmap-group{
    margin-bottom:1.5rem;
}
.heatmap-group-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:1rem;
    margin-bottom:.65rem;
}
.heatmap-group-name{
    font-size:1rem;
    font-weight:700;
}
.heatmap-group-change{
    font-weight:700;
}
.heatmap-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
    gap:6px;
}
.heatmap-cell{
    position:relative;
    min-height:105px;
    border-radius:.55rem;
    padding:.7rem;
    color:#fff;
    cursor:pointer;
    overflow:hidden;
    transition:transform .12s ease,filter .12s ease;
}
.heatmap-cell:hover{
    transform:scale(1.02);
    filter:brightness(1.08);
}
.heatmap-cell-name{
    font-weight:700;
    line-height:1.3;
    text-shadow:0 1px 2px rgba(0,0,0,.35);
}
.heatmap-cell-change{
    font-size:1.1rem;
    font-weight:800;
    margin-top:.35rem;
    text-shadow:0 1px 2px rgba(0,0,0,.35);
}
.heatmap-cell-meta{
    font-size:.7rem;
    opacity:.9;
    position:absolute;
    left:.7rem;
    bottom:.55rem;
}
.heatmap-cell.company-cell{
    min-height:85px;
}
.heatmap-legend{
    display:flex;
    align-items:center;
    gap:.5rem;
    font-size:.75rem;
    color:var(--bs-secondary-color);
}
.heatmap-legend-bar{
    width:180px;
    height:10px;
    border-radius:99px;
    background:linear-gradient(90deg,#198754,#adb5bd,#dc3545);
}
.heatmap-empty{
    border:1px dashed var(--bs-border-color);
    padding:2rem;
    text-align:center;
    color:var(--bs-secondary-color);
    border-radius:.75rem;
}
.nav-tabs .nav-link{
    cursor:pointer;
}
@media(max-width:1199.98px){
    #detail-panel{
        display:none;
    }
}
@media(max-width:991.98px){
    body{
        overflow:auto;
    }
    #app{
        height:auto;
        min-height:100vh;
    }
    .app-body{
        display:block;
        overflow:visible;
    }
    #sidebar{
        width:100%;
        min-width:0;
        max-height:38vh;
        border-right:0;
        border-bottom:1px solid var(--bs-border-color);
    }
    #sidebar.collapsed{
        width:100%;
        min-width:0;
        max-height:0;
        border-bottom:0;
    }
    #main-area{
        min-height:70vh;
        overflow:visible;
    }
    #tab-content-wrapper{
        overflow:visible;
    }
    .tab-pane-custom{
        height:auto;
        overflow:visible;
    }
    .relation-grid{
        grid-template-columns:1fr;
    }
    #map-scroll{
        padding:1rem;
    }
    .heatmap-grid{
        grid-template-columns:repeat(auto-fit,minmax(130px,1fr));
    }
}
</style>
</head>
<body>
<div id="app">
<nav class="navbar navbar-expand-lg bg-body-tertiary border-bottom app-navbar">
<div class="container-fluid">
<div class="d-flex align-items-center gap-2">
<button class="btn btn-outline-secondary btn-sm" id="sidebarToggle" title="收合/展開產業列表">
<i class="bi bi-layout-sidebar"></i>
</button>
<span class="navbar-brand fw-bold mb-0">
<i class="bi bi-diagram-3 me-2"></i>產業地圖
</span>
</div>
<div class="d-flex align-items-center gap-2">
<button class="btn btn-outline-secondary btn-sm" id="reloadBtn" title="重新載入資料">
<i class="bi bi-arrow-clockwise"></i>
</button>
<button class="btn btn-outline-secondary btn-sm" id="themeBtn" title="切換深色模式">
<i class="bi bi-moon"></i>
</button>
</div>
</div>
</nav>
<div class="app-body">
<aside id="sidebar">
<div class="sidebar-header">
<div class="input-group input-group-sm">
<span class="input-group-text">
<i class="bi bi-search"></i>
</span>
<input id="industrySearch" type="search" class="form-control" placeholder="搜尋產業...">
</div>
</div>
<div id="industryGroups" class="industry-groups">
<div class="text-center text-body-secondary p-4">尚未載入資料</div>
</div>
</aside>
<main id="main-area">
<ul class="nav nav-tabs px-3 pt-2 bg-body-tertiary" id="mainTabs">
<li class="nav-item">
<button class="nav-link active" data-tab="map">
<i class="bi bi-diagram-3 me-1"></i>產業關聯圖
</button>
</li>
<li class="nav-item">
<button class="nav-link" data-tab="heatmap">
<i class="bi bi-grid-3x3-gap me-1"></i>產業 Heatmap
</button>
</li>
</ul>
<div id="tab-content-wrapper">
<div id="map-tab" class="tab-pane-custom">
<div id="map-toolbar" class="d-none">
<div class="d-flex flex-wrap align-items-center justify-content-between gap-2">
<div id="breadcrumb"></div>
<div class="btn-group btn-group-sm">
<button class="btn btn-outline-secondary" id="showAllBtn">全部</button>
<button class="btn btn-outline-secondary" id="showUpstreamBtn">上游</button>
<button class="btn btn-outline-secondary" id="showDownstreamBtn">下游</button>
<button class="btn btn-outline-secondary" id="showPeersBtn">同業</button>
</div>
</div>
</div>
<div id="map-scroll">
<div id="map-content" class="empty-state">
<div>
<div class="empty-state-icon"><i class="bi bi-diagram-3"></i></div>
<h4>產業地圖</h4>
<p class="text-body-secondary mb-0">從左側選擇一個產業開始</p>
</div>
</div>
</div>
</div>
<div id="heatmap-tab" class="tab-pane-custom d-none">
<div id="heatmap-page">
<div id="heatmap-content">
<div class="text-center text-body-secondary p-5">
<div class="spinner-border spinner-border-sm me-2"></div>
正在載入 Heatmap...
</div>
</div>
</div>
</div>
</div>
</main>
<aside id="detail-panel">
<div class="detail-header">
<strong>詳細資訊</strong>
<button class="btn btn-sm btn-outline-secondary" id="closeDetailBtn">
<i class="bi bi-x-lg"></i>
</button>
</div>
<div id="detail-content">
<div class="text-center text-body-secondary p-4">
選擇產業或個股查看詳細資訊
</div>
</div>
</aside>
</div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
<script>
const CONFIG={
    files:{
        relations:"imsrc/industry-relations.json",
        stockIndustries:"imsrc/stock-industries.json",
        industries:"imsrc/industries.json",
        heatmap:"imsrc/heatmap-data.json"
    },
    detailPath:"https://aistockmap.com/live/topics/"
};
const state={
    relations:{},
    stockIndustries:{},
    industries:{},
    industriesArray:[],
    heatmapData:null,
    selectedIndustry:null,
    selectedStock:null,
    currentIndustryDetail:null,
    relationFilter:"all",
    currentTab:"map",
    sidebarCollapsed:false
};
const $=selector=>document.querySelector(selector);
const $$=selector=>[...document.querySelectorAll(selector)];
document.addEventListener("DOMContentLoaded",init);
async function init(){
    bindEvents();
    await loadData();
}
function bindEvents(){
    $("#industrySearch").addEventListener("input",e=>renderIndustryGroups(e.target.value));
    $("#themeBtn").addEventListener("click",toggleTheme);
    $("#reloadBtn").addEventListener("click",loadData);
    $("#sidebarToggle").addEventListener("click",toggleSidebar);
    $("#closeDetailBtn").addEventListener("click",clearDetailPanel);
    $("#showAllBtn").addEventListener("click",()=>setRelationFilter("all"));
    $("#showUpstreamBtn").addEventListener("click",()=>setRelationFilter("upstream"));
    $("#showDownstreamBtn").addEventListener("click",()=>setRelationFilter("downstream"));
    $("#showPeersBtn").addEventListener("click",()=>setRelationFilter("peers"));
    $$("#mainTabs .nav-link").forEach(button=>{
        button.addEventListener("click",()=>switchTab(button.dataset.tab));
    });
}
async function loadData(){
    try{
        showLoading();
        const [relations,stockIndustries,industries,heatmapData]=await Promise.all([
            fetchJSON(CONFIG.files.relations),
            fetchJSON(CONFIG.files.stockIndustries),
            fetchJSON(CONFIG.files.industries),
            fetchJSON(CONFIG.files.heatmap)
        ]);
        state.relations=normalizeObject(relations);
        state.stockIndustries=normalizeObject(stockIndustries);
        state.industriesArray=normalizeIndustries(industries);
        state.industries={};
        state.industriesArray.forEach(industry=>{
            state.industries[industry.id]=industry;
        });
        state.heatmapData=heatmapData||{topics:{}};
        renderIndustryGroups();
        renderHeatmap();
        if(state.selectedIndustry){
            await selectIndustry(state.selectedIndustry);
        }else{
            showEmptyState();
        }
    }catch(error){
        console.error(error);
        showLoadError(error);
    }
}
async function fetchJSON(url){
    const response=await fetch(url+"?_="+Date.now());
    if(!response.ok){
        throw new Error(`${url} HTTP ${response.status}`);
    }
    return await response.json();
}
async function fetchIndustryDetail(industryId){
    const url=CONFIG.detailPath+encodeURIComponent(industryId)+".json";
    return await fetchJSON(url);
}
function normalizeObject(value){
    if(value&&typeof value==="object"&&!Array.isArray(value))return value;
    return {};
}
function normalizeIndustries(data){
    if(Array.isArray(data)){
        return data.filter(x=>x&&x.id);
    }
    if(data&&typeof data==="object"){
        return Object.entries(data).map(([id,value])=>{
            if(typeof value==="string"){
                return {id,name:value,shortname:value,group:"其他"};
            }
            return {id,...value};
        });
    }
    return [];
}
function getGroup(industry){
    return industry?.group||industry?.category||industry?.parent||"其他";
}
function countStocks(industryId){
    const topic=state.heatmapData?.topics?.[industryId];
    if(Array.isArray(topic?.companies))return topic.companies.length;
    return Object.values(state.stockIndustries).filter(ids=>Array.isArray(ids)&&ids.includes(industryId)).length;
}
function renderIndustryGroups(filter=""){
    const container=$("#industryGroups");
    const keyword=filter.trim().toLowerCase();
    const filtered=state.industriesArray.filter(industry=>{
        if(!keyword)return true;
        return [
            industry.id,
            industry.name,
            industry.shortname,
            industry.description,
            getGroup(industry)
        ].filter(Boolean).join(" ").toLowerCase().includes(keyword);
    });
    const groups={};
    filtered.forEach(industry=>{
        const group=getGroup(industry);
        if(!groups[group])groups[group]=[];
        groups[group].push(industry);
    });
    const groupNames=Object.keys(groups).sort();
    if(!groupNames.length){
        container.innerHTML=`<div class="text-center text-body-secondary p-4">找不到符合條件的產業</div>`;
        return;
    }
    container.innerHTML=groupNames.map((group,index)=>{
        const industries=groups[group];
        const collapseId="group-"+index;
        return `
<div class="group">
<div class="group-header" data-bs-toggle="collapse" data-bs-target="#${collapseId}">
<span><i class="bi bi-folder2 me-2"></i>${escapeHTML(group)}</span>
<span class="text-body-secondary">${industries.length}<i class="bi bi-chevron-down ms-1"></i></span>
</div>
<div id="${collapseId}" class="collapse show">
<div class="industry-list">
${industries.map(renderIndustryItem).join("")}
</div>
</div>
</div>`;
    }).join("");
    $$(".industry-item").forEach(button=>{
        button.addEventListener("click",()=>selectIndustry(button.dataset.id));
    });
    updateSidebarActive();
}
function renderIndustryItem(industry){
    const active=industry.id===state.selectedIndustry?"active":"";
    const count=industry.companyCount??countStocks(industry.id);
    return `
<button class="industry-item ${active}" data-id="${escapeAttr(industry.id)}">
<i class="bi bi-chevron-right"></i>
<span class="text-truncate">${escapeHTML(industry.shortname||industry.name||industry.id)}</span>
${count?`<span class="badge text-bg-secondary industry-count">${count}</span>`:""}
</button>`;
}
function updateSidebarActive(){
    $$(".industry-item").forEach(button=>{
        button.classList.toggle("active",button.dataset.id===state.selectedIndustry);
    });
}
async function selectIndustry(industryId){
    if(!industryId)return;
    state.selectedIndustry=industryId;
    state.selectedStock=null;
    state.relationFilter="all";
    state.currentIndustryDetail=null;
    updateSidebarActive();
    switchTab("map",false);
    renderMap();
    renderIndustryDetailLoading();
    try{
        const detail=await fetchIndustryDetail(industryId);
        if(state.selectedIndustry!==industryId)return;
        state.currentIndustryDetail=detail;
        renderIndustryDetailBelowMap(detail,industryId);
        renderIndustrySidePanel(detail,industryId);
    }catch(error){
        console.error("產業詳細資料載入失敗：",error);
        renderIndustryDetailError(industryId,error);
    }
}
function setRelationFilter(filter){
    state.relationFilter=filter;
    renderMap();
    if(state.currentIndustryDetail){
        renderIndustryDetailBelowMap(state.currentIndustryDetail,state.selectedIndustry);
    }
}
function renderMap(){
    const industry=getIndustry(state.selectedIndustry);
    if(!industry)return;
    $("#map-toolbar").classList.remove("d-none");
    renderBreadcrumb(industry);
    const relation=state.relations[state.selectedIndustry]||{};
    let upstream=uniqueArray(relation.upstream);
    let downstream=uniqueArray(relation.downstream);
    let peers=uniqueArray(relation.peers);
    if(!upstream.length&&!downstream.length&&!peers.length){

        if(relation.peers?.includes(industryId))result.peers.push(source);
    });
    return{

function uniqueArray(array){
    if(!Array.isArray(array))return [];
    return [...new Set(array.filter(Boolean))];
}
function escapeHTML(value){
    return String(value??"").replace(/[&<>"']/g,char=>({
        "&":"&amp;",
        "<":"&lt;",
        ">":"&gt;",
        '"':"&quot;",
        "'":"&#039;"
    })[char]);
}
function escapeAttr(value){
    return escapeHTML(value);
}
function formatNumber(value){
    const number=Number(value);
    if(!Number.isFinite(number))return "-";
    return number.toLocaleString("zh-TW",{maximumFractionDigits:2});
}
function formatChange(value){
    const number=Number(value);
    if(!Number.isFinite(number))return "-";
    return `${number>0?"+":""}${number.toFixed(2)}%`;
}
function getChangeClass(value){
    const number=Number(value);
    if(number>0)return "text-up";
    if(number<0)return "text-down";
    return "text-body-secondary";
}
function weightedAverage(companies,field="change1D"){
    let weightedSum=0;
    let totalWeight=0;
    companies.forEach(company=>{
        const value=Number(company[field]);
        const weight=Number(company.marketCap);
        if(Number.isFinite(value)&&Number.isFinite(weight)&&weight>0){
            weightedSum+=value*weight;
            totalWeight+=weight;
        }
    });
    return totalWeight?weightedSum/totalWeight:null;
}
function sumMarketCap(companies){
    return companies.reduce((sum,company)=>{
        const value=Number(company.marketCap);
        return sum+(Number.isFinite(value)&&value>0?value:0);
    },0);
}
function buildHeatmapData(){
    const topics=state.heatmapData?.topics||{};
    const subIndustries=[];
    Object.entries(topics).forEach(([industryId,topic])=>{
        const companies=Array.isArray(topic.companies)?topic.companies:[];
        if(!companies.length)return;
        const industry=getIndustry(industryId);
        const marketCap=sumMarketCap(companies);
        const change=weightedAverage(companies,"change1D");
        subIndustries.push({
            id:industryId,
            name:topic.displayName||industry?.shortname||industry?.name||industryId,
            group:getGroup(industry),
            companies,
            marketCap,
            change
        });
    });
    const groupMap={};
    subIndustries.forEach(item=>{
        if(!groupMap[item.group])groupMap[item.group]=[];
        groupMap[item.group].push(item);
    });
    const groups=Object.entries(groupMap).map(([name,items])=>{
        const allCompanies=items.flatMap(item=>item.companies);
        return{
            name,
            items,
            marketCap:sumMarketCap(allCompanies),
            change:weightedAverage(allCompanies,"change1D")
        };
    }).sort((a,b)=>(b.change??-Infinity)-(a.change??-Infinity));
    return{
        subIndustries:subIndustries.sort((a,b)=>(b.change??-Infinity)-(a.change??-Infinity)),
        groups
    };
}

}

function renderHeatmapCell(item){
    const size=Math.max(1,Math.log10(item.marketCap+1));
    const color=getHeatmapColor(item.change);
    return `
<div class="heatmap-cell" data-industry-id="${escapeAttr(item.id)}" style="background:${color};grid-column:span ${size>11?2:1};min-height:${Math.min(180,90+size*5)}px;">
<div class="heatmap-cell-name">${escapeHTML(item.name)}</div>
<div class="heatmap-cell-change">${formatChange(item.change)}</div>
<div class="heatmap-cell-meta">市值 ${formatMarketCap(item.marketCap)}</div>
</div>`;
}
function getHeatmapColor(change){
    const value=Number(change);
    if(!Number.isFinite(value))return "#6c757d";
    const max=8;
    const ratio=Math.min(Math.abs(value)/max,1);
    if(value>0){
        const r=Math.round(220-(220-120)*ratio);
        const g=Math.round(53+(180-53)*ratio);
        const b=Math.round(69+(90-69)*ratio);
        return `rgb(${r},${g},${b})`;
    }
    if(value<0){
        const r=Math.round(25+(220-25)*(1-ratio));
        const g=Math.round(135-(135-53)*ratio);
        const b=Math.round(84-(84-69)*ratio);
        return `rgb(${r},${g},${b})`;
    }
    return "#6c757d";
}
function formatMarketCap(value){
    const number=Number(value);
    if(!Number.isFinite(number))return "-";
    if(number>=1e12)return `${(number/1e12).toFixed(2)}T`;
    if(number>=1e9)return `${(number/1e9).toFixed(1)}B`;
    if(number>=1e6)return `${(number/1e6).toFixed(0)}M`;
    return number.toLocaleString("zh-TW");
}
function bindHeatmapEvents(){
    $$("#heatmap-content [data-industry-id]").forEach(element=>{
        element.addEventListener("click",()=>{
            selectIndustry(element.dataset.industryId);
        });
    });
    $$("#heatmap-content [data-group-name]").forEach(element=>{
        element.addEventListener("click",()=>{
            const group=element.dataset.groupName;
            const first=state.industriesArray.find(industry=>getGroup(industry)===group);
            if(first)selectIndustry(first.id);
        });
    });
}
</script>
